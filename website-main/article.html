At a mere 17 years old, Max Verstappen became a Formula One driver, the youngest in history. This prompted the Fédération Internationale de l'Automobile to create a new rule where drivers must be at least 18 years old before getting the promotion to F1. This rule was modified in 2024 when many assumed that Antonelli would replace Hamilton at Mercedes the following year. The FIA ruled that drivers as young as 17 could race in F1 as long as they had “recently and consistently demonstrated outstanding ability and maturity in single-seater formula car competition” (FIA's International Sporting Code). This made Antonelli, 17 at the time, eligible to participate in a free practice session or even race in a grand prix. Even though it was a possibility, Antonelli did not start a race as a Mercedes driver until he was 18 years old. At 18 years and 202 days old, Antonelli is the third-youngest driver to start an F1 race. The record holder and runner-up, Verstappen and Stroll, both retired in their debut races. Even though Antonelli was slightly older, he was the one who fared the best in his first-ever race, finishing just off the podium in fourth place. 

Verstappen is also the youngest driver to win an F1 race. He won in his second year in F1 and his first year with Red Bull Racing when he won the 2016 Spanish Grand Prix. Antonelli came close to this record about a decade later when his maiden win came at the 2026 Chinese Grand Prix at 19 years and 202 days old. Even though Antonelli did not break Verstappen’s record, both drivers achieved their first win in their second season in the sport. If Antonelli’s career resembles Verstappen’s career, the Italian driver should become familiar with the top step of the podium.

<b>Sebastian Vettel</b>

Back in 2008, at the Italian Grand Prix, Sebastian Vettel became the youngest driver to be on pole position when he was just over 21 years old. Vettel was able to keep this record until this year, when Antonelli started first at the 2026 Chinese Grand Prix. Antonelli did this when he was 19 years and 6 months old, clearing Vettel’s record by more than 18 months.

Two years after Vettel achieved his first pole position, he won his first World Championship. At 23 years and 133 days old, he was, and still is, the youngest to do so. Currently, Antonelli is 19 years old, which gives him about four years to break this record. If he is able to follow in Vettel’s footsteps, F1 may soon see a new multi-year World Champion.

Despite Antonelli being unable to legally drink the podium champagne in all of the countries that Formula One races in, he has already shown his immense talent. He has cemented himself in the history books with some of the greatest drivers that the sport has ever seen. At only nineteen years old, the sky is the limit for the young driver from Bologna.
  `}
            ,"3-things-you-missed-Hungary":{
                title:"3 Things you missed: Hungarian Grand Prix",
                subtitle:"Hidden Highlights of the Hungarian GP: Audi scores with Nico, VCARB hits P5, and Russell recovers to P7."
                ,image:"assets/images/F1/3 things hungary.avif",
                authorName:"Melinda Gaese",
                authorPic:"assets/images/authors/Melinda-Gaese.jpeg",
                content:`There are not many races that have felt quite as long as the Hungarian Grand Prix. Yesterday, we got 70 laps full of action and drama, with Oscar getting the lead, the midfield fighting and some really good fights between Lewis and Max. After Lap 30, it already felt like a whole race, with Lando ending it as the winner —his first win as the reigning world champion and Antonelli and Verstappen sharing the podium with him, with Max himself saying afterwards that he isn’t even sure how he ended up on the podium. 

                Beyond the podium, here are three key takeaways you might have missed from the weekend: 

                <b>Nico Hülkenberg’s first points with Audi </b>

                It was a long time coming. For a while now the Audi Revolut F1 Team showed that  they are not just the new team but they are also able to compete comfortably in the mid field, with Gabriel Bortoleto gaining the team a good haul of points over the last races. Yesterday, in Hungary, it was finally Nico Hülkenberg's time to shine. After eleven races, a lot of ups and downs, the German driver finished in 9th place and gained two more points for the team. With that, they were able to advance to 8th place in the constructors’ championship standings with 12 points, sandwiched between Williams with 11 points and Haas with 21 points. 

                <b>Visa Cash App RB proving again that they are just more than just a junior team </b>

                Liam Lawson and Arvid Lindblad showed again how good they are at working together and how comfortable they are with the car the team gave them. Arvid Lindblad proves again and again that he is that rookie, the driver people often overlook but they really shouldn’t. His results speak for themselves, lining up with Liam Lawson who also shows up again and again, fighting for places and points. The team starts the summer break with another haul of points in the bag and overtakes Alpine in the standings, getting comfortable in p5. And not just that. The only teams that gained more points over the first half of the season are the 4 top teams —McLaren, Mercedes, Red Bull and Ferrari; an achievement the whole team worked hard for. P5 is already a big step ahead, gaining them important money for the next season if they can defend their standing after the summer break. Also, the Visa Cash App RB team delivered the fastest pitstop of the season with 1.99 seconds.

                <b>George Russell’s anti-stall issue</b>

                Lining up sixth in the starting grid, it didn’t look too bad for the British driver —that is until the lights went out and fans all over the world watched him tumble down on the timing tower. An anti-stall issue, pushing him down onto the last place on the opening lap. Suddenly it seemed like the promise to fix his car was just a promise, nothing more. But George fought back, gaining place after place with overtakes and good pitstops. In the end, he finished the race in p7, gaining himself 6 more points. Looking at the standings, Kimi Antonelli leads with a 59 points gap to George, building up his lead comfortably. But we all know the sport, nothing is impossible and it’s not over until it’s over. We are excited for a renewed Mercedes title fight after the summer break. 
            `}

            ,"Race-Recap-Hungary":{
                title: "Race Recap: Hungarian Grand Prix",
                subtitle:"Lando Norris navigated late-race strategy tension, team radio drama, and a gearbox failure for teammate Oscar Piastri to secure a dominant victory for McLaren.",
                image:"assets/images/F1/hungary race.webp",
                authorName:"Ellie Roddy",
                authorPic:"assets/images/authors/ellie-roddy.jpeg",
                content:`After qualifying saw Sergio Perez relegated to a pit lane start, while Lewis Hamilton and Kimi Antonelli both served three-place grid penalties, all eyes turned to race day to see who would come out on top at the Hungaroring.

Lando Norris made an excellent launch off the line, but the opening corners quickly reshuffled the order. Oscar Piastri passed Charles Leclerc, while Max Verstappen moved up into third at Turn 1. Hamilton also found a way past Leclerc as Piastri swept around Norris to take the race lead.

Behind them, George Russell suffered a nightmare start after an anti-stall issue dropped him all the way to 21st place. His race engineer immediately asked, “What happened therae?” to which Russell simply replied, “Anti-stall.” Elsewhere, Esteban Ocon ran wide at Turn 1 but managed to continue.

The opening stint settled into a tactical battle from laps two to seven, with drivers carefully managing tyres while attacking and defending. Russell began an impressive recovery drive, climbing from 21st to 14th in just a handful of laps. Verstappen, however, was already unhappy with the handling of his Red Bull, telling his engineer, “Also, again, the damping failed for sure. Spice it up a bit.”

Perez’s difficult weekend continued when Race Control noted a starting procedure infringement, adding another setback after already suffering a brake fire in practice and starting from the pit lane.

By lap 10, tyre management had become a talking point. Norris reported, “Dirty air,” when asked about the condition of his tyres, highlighting the struggles of following another car closely. Piastri, meanwhile, was in a much happier position, responding simply, “Tyres feels good.”

Two laps later, Hamilton began closing rapidly on Verstappen, telling Mercedes, “Max is really slow.” At the same time, Verstappen continued voicing his frustrations over team radio, saying, “Please do something about these shifts and don’t tell me it’s me shifting later.”

Mercedes reacted first in the strategy battle, bringing Hamilton into the pits on lap 14 in an attempt to undercut Verstappen. The stop worked perfectly, allowing Hamilton to emerge ahead of Nico Hülkenberg before quickly overtaking Arvid Lindblad a few corners later.

The undercut paid off on lap 15. Verstappen stopped for fresh tyres but rejoined behind Hamilton, handing the Mercedes driver the advantage, although it would not last for long.

Drama unfolded on lap 16 when Valtteri Bottas suffered smoking brakes that soon caught fire. Although he attempted to return to the pits, he was forced to stop before reaching them. McLaren had originally planned to pit Piastri but instructed him to stay out because of Bottas’ stranded car. Verstappen also managed to reclaim position from Hamilton shortly afterwards.

Verstappen remained frustrated, reporting on lap 17, “I don’t want to complain, but that was again. Moving under braking. I mean, it’s nice action, but it’s not right.”

The pit cycle briefly promoted Antonelli into the race lead on lap 18, with Isack Hadjar running second. However, normal order resumed quickly as both McLarens overtook Hadjar on lap 19 before Verstappen also moved past the Racing Bulls driver a couple of laps later.

Norris ran wide at Turn 2 on lap 22, while McLaren comfortably held a one-two from laps 23 to 27. Despite leading, Piastri admitted his tyres were beginning to struggle. When asked, “Plan A, how’s the tyre?” he replied, “It doesn’t feel great.” Ferrari’s Charles Leclerc was also becoming frustrated, saying, “We are losing quite a bit of time!”

As the race entered laps 32 and 33, McLaren faced a strategic dilemma. Piastri was being urged to increase his pace, but worn tyres prevented him from pulling away, with Norris sitting just six tenths behind. Norris wanted to attack for the lead, saying over team radio, “You mean you won’t let me? I’m miles faster.” However, with Piastri leading the race, he retained priority for the preferred pit-stop strategy.

Late-race tension increased on lap 39 when Carlos Sainz and Piastri made contact. Furious over the incident, Piastri shouted, “Get out my way you ****** idiot. Oh my God.”

Two laps later, Oliver Bearman spun after struggling for grip on worn tyres. At the same time, Race Control confirmed the Sainz-Piastri collision was under investigation. Clearly still frustrated, Piastri told his engineer, “Mate, don’t ***** talk to me now.”

The stewards later handed Sainz a five-second time penalty for causing the collision.

On lap 46, Norris and Antonelli battled fiercely for the race lead before Norris completed the move to reclaim first place.

Leclerc’s frustrations continued on lap 50 as he reported, “Something feels wrong with the car.” His engineer reassured him by saying, “Looks like overheating, you can get back into the rhythm. That should help.” Leclerc sarcastically replied, “Which rhythm?”

Perez’s race finally came to an end on lap 51 after suffering suspension issues, while another late twist arrived on lap 56 when Piastri stopped on track with a gearbox failure. Reporting the issue over the radio, he explained that he had lost the gearbox, bringing out the Virtual Safety Car. During this period, Bearman was also handed a five-second penalty for ignoring blue flags.

The battle for the final points positions intensified on lap 62 as Liam Lawson, Arvid Lindblad and Hülkenberg fought over eighth, ninth and tenth. Between laps 63 and 65, Antonelli became frustrated while trying to lap slower cars, repeatedly wanting blue flags shown so he could get through cleanly.

Hamilton’s afternoon took another hit when he received a five-second penalty for speeding in the pit lane. His response summed up the feeling of the closing laps: “Ah, they are handing out penalties like crazy.”

At the chequered flag, it was Norris who emerged victorious after another composed drive, securing victory in the Hungarian Grand Prix ahead of a hard-fought field after an action-packed afternoon full of strategy, penalties, dramatic team radio and late-race drama.
                `}
            ,"F2-Feature-Recap-Hungary":{
                title: "Formula 2 Feature Race Recap: Hungary",
                subtitle:"Noel León capitalized on a perfectly timed Virtual Safety Car pit stop to charge through the field and claim his maiden Formula 2 Feature Race victory at the Hungaroring.",
                image:"assets/images/F2/feature race hungary.jpeg",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`Drama got underway almost immediately at the Hungaroring when Roman Bilinski stalled on the grid during the formation lap. After rolling back to his garage, he was able to start from the pit lane.

Kush Maini, starting from pole position, was looking for his first feature race win in F2. With a strong start, he was able to stay in front. Behind him, Noel Leon passed Rafael Câmara on the opening lap.

By the end of lap 2, Maini had a gap of 1.8 seconds to Leon; Maini also set the first fastest lap of the session with a time of 1:34.420.

Martinius Stenshorne had to pit on lap 4 after damage from contact involving himself, John Bennett, and Nikola Tsolov. Rodin Motorsport was able to make some quick repairs, and he rejoined the race two laps later.

The top five drivers all started on soft tyres, which started to lose pace around lap 7. On lap 12, Cian Shields, who pitted for mediums, set the fastest lap of the race; his time was 1:33.133.

Tasanapol Inthraphuvasak, on medium tyres, passed Joshua Dürksen, with soft tyres, on lap 14; this marked the first overtake due to tyre strategy. The latter pitted for mediums on the following lap after it became clear that those tyres had an advantage in the race.

Rafael Villagomez caused a virtual safety car on lap 17, signaling the first DNF of the race. This timing benefitted Leon immensely, who was already in the process of changing tyres when this happened. While the rules state that a driver cannot make their compulsory pit stop during a VSC, it is allowed if the driver is in the midst of their pit stop when the VSC starts. Leon, who saved significant time, only lost nine places after changing tyres.

By lap 21, Leon was already up into sixth place; the only drivers in front of him were the ones who had not yet pitted. When Maini changed his tyres one lap later, he rejoined the race three places lower than Leon. 

Alexander Dunne, the last driver to pit, remained in the lead of the race until lap 32 when he was passed by Leon. Dunne locked up when entering the pit lane and rejoined the race just out of the points in 11th place.

With less than five laps remaining, the top three drivers all had DRS; Maini was 0.9 seconds behind Leon, and Câmara was 0.8 seconds behind Maini. 

Dürksen found himself in eighth after he lost two places, one to Dino Beganovic and one to Tsolov, in the span of a single lap. 

Leon won his first F2 feature race, followed by Maini in P2 and Câmara in P3. Only 0.8 seconds separated the top two, and 0.4 seconds separated second and third. Stenshorne set the fastest lap of the race on lap 26 with a time of 1:31.415.

Current championship leader Tsolov finished in seventh place, adding six points to his tally for the season. With five races left and a mere 22 points separating the top three, there is still a lot to play for in the championship.
                `}
            ,"Quali-Recap-Hungary":{
                title: "Qualifying Recap: Hungarian Grand Prix",
                subtitle:"Lando Norris dominated every phase of Hungarian Grand Prix qualifying to claim pole position for McLaren.",
                image:"assets/images/F1/hungary quali.jpeg",
                authorName:"Ellie Roddy",
                authorPic:"assets/images/authors/ellie-roddy.jpeg",
                content:`After three crucial practice sessions, the sun was shining as qualifying got underway at the Hungaroring. Mercedes had dominated qualifying in recent races, but could George Russell or Kimi Antonelli continue that streak, or would another driver take pole position?

<b>Q1</b>

The opening session saw Gabriel Bortoleto have his lap time deleted after exceeding track limits at Turn 4.

When the chequered flag fell, Sergio Pérez, Valtteri Bottas, Lance Stroll, Carlos Sainz, Alex Albon and Oliver Bearman were all eliminated. At the top of the timesheets, Lando Norris set the pace with a lap of **1:18.277**.

<b>Q2</b>

A yellow flag was briefly brought out after Isack Hadjar spun at Turn 12, disrupting several laps, including Bortoleto’s. Fortunately, Hadjar avoided the barriers, preventing the session from being red-flagged.

With just over two minutes remaining, Antonelli also had a lap deleted for exceeding track limits. Eliminated in Q2 were Liam Lawson, Pierre Gasly, Franco Colapinto, Gabriel Bortoleto, Esteban Ocon and Fernando Alonso.

For the second consecutive session, Norris finished fastest, posting a **1:17.456**.

<b>Q3</b>

The final shootout wasn’t without drama. With just seven seconds remaining, Max Verstappen spun, bringing out the yellow flags. Moments after the session ended, a double yellow flag was shown when George Russell stopped at Turn 1.

Despite the late interruptions, Norris held onto the fastest lap of the session to secure pole position with a time of **1:17.207**.
            `}
            ,"F2-Sprint-Race-Hungary":{
                title: "F2 Sprint Race Recap: Hungary",
                subtitle:"Gabriele Minì mastered scorching conditions in Budapest to win a dramatic F2 Sprint Race.",
                image:"assets/images/F2/sprint hungary.avif",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`With a track temperature of 49°C (120°F), the Hungaroring's Formula 2 Sprint Race kicked off at 14:15 local time. The race saw the top ten drivers reversed: Sebastian Montoya started in P1, just in front of Gabriele Mini in P2 and Dino Beganovic in P3. Montoya maintained the lead after a strong start, with Mini also keeping his position; Beganovic was passed by Nikola Tsolov, who started in fourth. 

Mini set the first fastest lap of the race in lap 3 with a time of 1:35.027. Within five laps, Montoya’s lead was reduced to under one second.

By lap 7, the top nine were stuck in a DRS train, with gaps between drivers ranging from 0.2 to 0.9 seconds. Mini found himself only 0.1 seconds behind Montoya and was able to have his first attempt to take the lead on lap 8. 

Kush Maini, who previously had the fastest lap, said on the radio that he could go faster. Stuck behind Tasanapol Inthraphuvasak, his ART Grand Prix teammate, Maini asked his engineer for a position swap but was told to wait for competitors’ tires to degrade.

Montoya ran wide at the last turn of lap 10, effectively removing the gap between himself and Mini. At the beginning of lap 17, Mini had DRS on Montoya and was able to take the lead of the race. Montoya’s lock-up and late braking closed the gap between the top two drivers, giving Mini an advantage. One lap later, Tsolov attempted to dive down the inside of Montoya, but was unsuccessful in gaining a position. 

Maini passed Inthraphuvasak on lap 19, putting Sunday’s pole-sitter up in seventh place.

With eight laps remaining, the battle for second place intensified; Montoya and Tsolov were separated by only 0.5 seconds. On lap 21, Tsolov made a late move, hitting Montoya and forcing the Prema driver to retire the car. Tsolov was able to complete the lap, but was then forced to pit the car for Campos Racing to try and fix the damages. However, the car was unable to be repaired and Tsolov also retired from the race. 

Noel León was given a five second time penalty for an infringement during the virtual safety car caused by Tsolov and Montoya’s collision.

Mini crossed the line in first, putting him only 16 points behind Tsolov in the championship. Beganovic got second place, with Laurens van Hoepen completing the podium in third. Roman Bilinski set the fastest lap of the race on lap 24 with a time of 1:30.989.

With the top three in the championship only separated by 31 points, Tsolov, Mini, and Rafael Câmara will be feeling the pressure for tomorrow’s feature race.
            `}
            ,"FP-Recap-Hungary":{
                title: "Free Practice Recap: Hungarian Grand Prix",
                subtitle:"Ferrari and McLaren trade blows through a chaotic, red-flagged practice in Hungary as Lando Norris leads the charge ahead of qualifying.",
                image:"assets/images/F1/hungary FP.webp",
                authorName:"Tori Turner",
                authorPic:"assets/images/authors/tori-turner.jpeg",
                content:`<b>FP1: Leclerc fastest despite car issues</b>

The session began with almost all of the grid taking to the track instantly, eager to head out on their preferred choice of medium tyres, with Aston Martin and Cadillac opting for hards. Notably, five full-time members of the grid handed their cars over to rookie drivers, fulfilling the requirement in the regulations which allows rookie drivers to gain valuable experience in the machinery.

McLaren used this to their advantage, making Leonardo Fornaroli, who was stepping into Oscar Piastri's car for the hour, test out their new rotational rear wing. Later on in the session, they confirmed that the ‘rear wing was working well’, although the team has already confirmed it won't be used in any racing action this weekend.

Max Verstappen encountered the expected traffic early on in the session, braking heavily to avoid a slow Carlos Sainz on the racing line. After passing Sainz, he then came across a similarly slow Gabriel Bortoleto, who angered him further: “Unbelievable these guys! That was actually really dangerous, like he even slammed on the brakes!”

As Lance Stroll exited turn two, the left rear suspension of his car failed, sending the car spinning across the track until it finally came to a stop outside of turn three. The car had previously spent time in the garage undergoing setup changes, alongside Aston Martin bringing 16 upgrades to Hungary this weekend.

Race control initially issued a yellow flag, before switching to a red flag, which halted running with 23 minutes left, albeit briefly, as action resumed shortly after. However, Carlos Sainz locked up and narrowly avoided the barriers at turn one, bringing out another set of yellow flags before he reversed out and continued his lap.

Issues continued across the grid as Leclerc limped back to the pits, parking up at the entry with a suspected gearbox failure as he explained on his radio: “Something broke”. His Ferrari mechanics greeted him swiftly, rushing down the pitlane and spraying a fire extinguisher at his hot brakes. 

Despite his troubles, Leclerc ended the session ahead of the rest, setting the benchmark with a 1:19.075. A big gap then separated the Monégasque from Verstappen and Hamilton in second and third, with many predicting that Ferrari will favour the circuit this weekend.

<b>FP2: Ferrari dominates as Norris impresses</b>

The 21 drivers had to fight against an inconsistent breeze from the beginning of the session, battling tricky conditions amidst ongoing faults with their machinery. Before any running commenced, Aston Martin confirmed Lance Stroll's absence at the beginning of the session, explaining that there had not been enough time to fix the damage from his suspension failure in FP1.

Both Mercedes drivers struggled with the car in the early stages of the session, though both reported different issues affecting their runs. Russell noted that the car felt out of balance, whilst Antonelli found himself locking up: “Oh my god. I almost spun twice on braking. What is going on?”

Lewis Hamilton topped the times in the first half of the session, setting a time that was 0.135s faster than teammate Charles Leclerc. When the field switched to their first runs on soft tyres, Lando Norris set the next fastest time, a 1:19.228, ahead of Max Verstappen.

Franco Colapinto lost the rear whilst turning into the corner, sending him spinning out backwards into the barriers with a heavy thud. The impact destroyed his rear wing and brought out a red flag, halting any track action with 23 minutes left on the clock. “I’m ok,” the Argentine reported over his radio, before the marshals moved his car to sit on a nearby hill for the rest of the session.

Despite setting fast sectors, Max Verstappen came on the radio to report a concern with his car: “I think I hit debris on my front wing, just keep an eye on it. I don't know what it was.” Fortunately for the Dutchman, Red Bull quickly assured their driver that he had not sustained any damage.

Drivers continued to face difficulties with their cars, a recurring theme for every team as they figured out the nuances of the new cars around such a technical circuit. Antonelli ran wide once again, fighting against wheels that have developed a tendency for locking up this afternoon. 

The session closed with Hamilton returning to the top ahead of Leclerc and Norris, bringing the reigning world champion into contention alongside the two Ferraris who continue to be the team to beat around the Hungaroring. After Mercedes’ earlier troubles, championship leader Antonelli failed to set a lap on the soft tyres, leaving him down in 13th whilst teammate Russell finished fifth.  

<b>FP3: Norris fastest ahead of qualifying </b>

Compared to the tumultuous breeze the drivers faced in FP2, the drivers now had to contend with rising temperatures and a dusty track surface in the final practice session of the weekend. 

Desperate to catch up on crucial missed running after sitting out FP1 and crashing in FP2, Colapinto headed out first on soft tyres whilst the rest of the field opted to wait in the garage. Finding himself in a similar situation, Lance Stroll joined the Argentine out on track, finally ready to test out Aston Martin's upgrades after his dramatic suspension failure. 

Sergio Perez took to the track after mechanics worked on his car during the first portion of the session, though his run was cut short by plumes of smoke coming from the rear of his car: "Lost the engine... And had a massive brake, looks like the brakes are on fire at the back." He managed to stop the car at turn two, but race control issued a quick red flag to clear the circuit.

Antonelli struggled on his first attempt of a fast run, running over the curb and exceeding track limits, something which he is becoming known for during races. He headed back to the pits, turning down a front wing change from his mechanics before he headed back out and set a time that put him second behind Leclerc.

Arvid Lindblad managed to get a handful of laps in at the end of the session, despite it looking like he would not participate after his car underwent a precautionary power unit change. The lack of running did not deter the rookie driver, as he set a time to place him 14th.

In the closing stages, Lando Norris emerged as the driver to beat, displaying raw pace as he set multiple fastest laps. The McLaren car looked particularly strong during the middle sector, whilst Ferrari dominated the final sector. 

The session finished with Norris leading the way, 0.117s ahead of Hamilton and Antonelli. With qualifying a few hours away, it now looks like pole position is all but decided between Norris and the Ferrari drivers.
            `}
            ,"F2-Quali-Recap-Hungary":{
                title:"Formula 2 Qualifying Recap: Hungary",
                subtitle:"Kush Maini steals pole position at the Hungaroring in a fiercely contested Formula 2 qualifying session.",
                image:"assets/images/F2/quali budapest.avif",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`At 15:55 local time, Formula 2 qualifying at the Hungaroring got underway. Dino Beganovic set the fastest time in practice earlier in the day, with a mere 0.021 separating the top three drivers in the first session of the weekend.

Oliver Goethe set the initial fastest time at 1:30.129, followed closely by John Bennett at 1:30.273. Fifteen drivers had a time on the board within the first eight minutes of the session, with the top eight only separated by 0.704 seconds.

Joshua Dürksen had a track time deleted with 22:13 left on the clock due to track limits at turn 14. His next lap saw him only seventh fastest overall. Nikola Tsolov returned to the pit lane after setting the fastest time at 1:29.601 with just over 19 minutes left in the session; this stayed the time to beat until Noel Leon and Kush Maini took first and second, respectively. 

Rafael Câmara quickly found more time, setting a new fastest lap time by just 0.106 seconds. He soon beat his own time, making him the provisional pole-sitter with one-third of the session time remaining. This feat also gave him the fastest Sector 1 and Sector 3 times, while Tsolov had the fastest time in Sector 2.

Tsolov was just barely able to go faster than Câmara, setting a time that was 0.010 seconds faster. However, Tsolov soon found himself in fourth place, behind Maini, Durksen, and Tasanapol Inthraphuvasak. 

Maini returned to the garage with about two minutes left in the session, hoping that no one would beat his time of 1:28.896. Leon was able to set a purple sector in Sector 1, but Câmara quickly took that feat away from him.

As the session ended, Martinius Stenshorne was noted for impeding at turn 12 and was placed under investigation by race control.

Câmara and Leon both looked close to Maini’s time, but they were unable to beat the ART Grand Prix driver. Câmara starts on the front row in second place, with Leon just behind in third. Championship leader Tsolov saw himself in only seventh place and will hope for a charge through the field over the rest of the weekend.
            `}
            
            ,"Lady-LightsOut-Haas":{
                title:"Lady LightsOut: The Royal Replacement",
                subtitle:"Lady LightsOut uncovers the growing scandal at Haas as Esteban Ocon’s precarious position opens the door for hungry rivals and rising stars.",
                image:"assets/images/F1/LLO ocon.jpg",
                font: "'Playfair Display', serif",
                authorName:"Tori Turner",
                authorPic:"assets/images/authors/tori-turner.jpeg",
                content:`<i>Dearest gentle reader,</i>

Whilst society’s most eager eyes remain fixated upon the whispers surrounding the illustrious teams and their coveted seats, it appears that a curious tale has emerged from the more neglected corners of the grid where talk has been rife all season long.

Mr Esteban Ocon, a gentleman once regarded with a respectable degree of promise under the careful management of Mr Toto Wolff, has found himself in a rather unfortunate predicament this season. When compared to his youthful counterpart, who impressed society greatly from his first performance, his results have left much to be desired.

After ten rounds of this grand spectacle, Mr Ocon has managed but three solitary points. Meanwhile, the young bear sits comfortably ahead, having amassed a far more respectable tally of eighteen and graced the points on three separate occasions.

Yet, it would be most ungenerous to lay the entirety of this disappointment at Mr Ocon’s feet alone. The Haas carriage has proven itself unreliable of late, leaving both of its occupants full of frustration and unable to showcase their true potential. One cannot ignore, however, the gentleman’s growing reputation for discord, most notably with his own teammate. His tendency to clash with his fellows has not gone unnoticed, with the opening lap of the Belgian Grand Prix providing yet another scandalous example. 

Given such conduct, it is perhaps unsurprising that whispers are now circulating suggesting that Mr Ocon’s position on next season’s grid is, at best, precarious. And who, you may ask, stands ready to claim this seat? 

The American outfit has entertained a most intriguing guest list. Among them, a familiar face returns to the conversation after a year away from the spectacle. Mr Yuki Tsunoada, a driver whose tenure under the Red Bull banner ended at the close of the 2025 season, has remained a constant presence in the paddock with his former employers. With his plethora of experience and connections, it is no surprise that he is being considered as a fine replacement.

Then there is the promising Mr Leonardo Fornaroli, the reigning champion of Formula 2 and a young man who has collected titles in an impressive succession. Currently left waiting in the wings if McLaren should ever call upon him, one imagines his patience may not endure indefinitely as other categories tempt him.

But perhaps the most interesting conversation surrounds one who is still chasing his next title, Mr Rafael Câmara. Reports suggest he is destined for a reserve role next season with the American team, raising eyebrows everywhere over such an arrangement. His triumph in Formula 3, alongside his impressive start to his campaign in Formula 2, has already proven he possesses the credentials for a full-time seat. Which leads one to wonder why such a talent would be asked to wait?

As ever, the answer lies not only in sheer performance, but in gathering momentum, playing the politics of this dramatic sporting event and forging alliances that will take you to the top. With this story constantly evolving, I am certain, dear reader, that you have not heard the end of this tale. 

<i>Yours truly,
Lady LightsOut</i>
            `}
            ,"Lights-on-Esteban-Ocon":{
                title:"LIGHTS ON: Esteban Ocon",
                subtitle:"From family sacrifices in karting to Grand Prix glory in Hungary, tracing the unrelenting grit and ironclad resolve of Esteban Ocon.",
                image:"assets/images/F1/lights on ocon.jpg",
                authorName:"Eya Amri",
                authorPic: "assets/images/authors/eya-amri.jpg",
                content: `In a sport often defined by gilded pathways, vast family fortunes, and seamless ladder climbs, Esteban Ocon stands as a striking reminder of sheer, unadulterated grit. Calm and polite outside the cockpit, Ocon transforms into one of the most uncompromising, fiercely resilient racers on the modern Formula 1 grid the moment the visor drops. He is a driver who built his career not on privilege, but on relentless work ethic and an ironclad belief that he belongs at the very top of motorsport.

                <b>Born from Sacrifice</b>

                Long before he was battling world champions under stadium lights, Ocon’s racing journey was forged through incredible family sacrifice. Hailing from Évreux, Normandy, his parents sold their home and garage, putting everything on the line to finance his karting career. Living out of a caravan as they traveled from track to track across France and Europe, failure was simply not an option. That raw, high-stakes pressure sharpened Ocon’s focus early on, instilling a driving style where every overtaking opportunity had to count.

                His talent quickly silenced any doubters as he blitzed through the junior ranks. In 2014, competing in the FIA Formula 3 European Championship, Ocon delivered a star-making campaign. Facing off against a star-studded field that included Max Verstappen, Ocon combined supreme consistency with blistering speed to claim the title. He followed up this triumph by conquering the GP3 Series in 2015 as a rookie, proving beyond a shadow of a doubt that his trajectory to the pinnacle of motorsport was earned purely through merit and performance.

                <b>Proving Ground</b>

                Ocon’s entry into Formula 1 came midway through 2016 with Manor, before securing a full-time seat at Force India in 2017. There, his wheel-to-wheel tenacity quickly became legendary, holding his ground alongside veteran teammate Sergio Pérez in intense, razor-thin battles. Despite sitting out the 2019 season as a Mercedes reserve driver, a setback that would have derailed lesser talents, Ocon returned stronger with Renault in 2020, capturing his maiden F1 podium at Sakhir.

                The crowning glory of his career arrived at the 2021 Hungarian Grand Prix. Soaking up relentless pressure from Sebastian Vettel for 66 grueling laps around the tight, technical Hungaroring, Ocon drove a flawless, ice-cool race to claim Enstone’s first victory in eight years. It was a masterclass in composure, showcasing that when an opportunity presents itself, Ocon possesses the mental fortitude to grasp it with both hands and never let go.

                <b>Driving into the Future</b>

                As Formula 1 continues to evolve through shifting grid dynamics and competitive regulation changes, Esteban Ocon remains an essential fixture of the paddock. His career trajectory proves that determination and inner resilience can overcome the steepest odds in modern motorsport. With new chapters unfolding and fresh challenges on the horizon, Ocon’s story is far from complete—and if his past has taught the paddock anything, it is never to count out the driver who fought for every inch to get here.
            `}
            ,"Three-things-you-missed-Spa":{
                title:"Three Things You Missed at the Belgian Grand Prix",
                subtitle:"How brilliant strategy calls, exclusive upgrades, and a historic rookie points streak stole the show under the radar at Spa.",
                image:"assets/images/F1/3 things spa.jpg",
                authorName:"Tori Turner",
                authorPic: "assets/images/authors/tori-turner.jpeg",
                content: `While the cameras and headlines naturally focus on the front-runners and the fight for the podium, it is easy to turn a blind eye to the drama unfolding deeper in the pack. The midfield battle at Spa-Francorchamps delivered some of the most impressive tactical execution and wheel-to-wheel racing of the entire weekend, proving that the final points positions are where the real grit lies. From strategic masterclasses to exclusive car upgrades, here are 3 things you might have missed from the Belgian Grand Prix! 

<b>Red Bull nails Hadjar's strategy</b>

Whilst all eyes may be on Red Bull's Max Verstappen for securing another podium amidst his struggles with the new regulations, Isack Hadjar delivered an impressive comeback from the rear of the grid that deserves just as much applause.

The seeds of the strategy that helped him achieve such a result were sown earlier this weekend when Red Bull announced a change of multiple power unit components for Hadjar. Having already exceeded the season’s quota for components, he was set to start at the back of the grid before he even took to the track. Red Bull wasted no time in factoring this into their plan for the race.

“We knew that was part of the plan starting nearly last and we worked on it quite a lot through practice sessions. One-lap pace was not the target and today it paid off. I'm glad we really put the work in on the long run. I think it really helped  and moving forward, [we can] maybe change the approach because it seems to work really well”

Having qualified 10th, he lined up on the penultimate spot of the grid in 21st, besting only Fernando Alonso with his penalty applied. Hadjar stayed out of trouble in the opening lap, instead taking advantage of the chaos that ensued between George Russell and Lewis Hamilton. This allowed the French-Algerian to dive into the pits under the safety car period, taking his mandatory pitstop as he switched from hards to medium. A lap later, he reappeared in the pitlane in a genius strategy call from Red Bull that returned him to the hard compound, allowing him to run the rest of the race on just one tyre.

Thus began Hadjar’s mission to move through the pecking order, ticking off the backmarkers first before he attacked the midfield. Each lap saw him inch closer towards the points, then the top five, closer to his teammate than expected. The latter stages of his race —when he was running in sixth— saw his position come under threat by Lando Norris, though a calm and focused drive ensured he remained right where he was to claim one of the most exciting comebacks of the 2026 season.

<b>VCARB's successful upgrade package</b>

Heading into Belgium, Racing Bulls were one of the nine teams that promised fruitful upgrade packages to better their chances at the circuit, and the upcoming races too. Whilst their sister team Red Bull focused on eliminating the omen of the Macarena wing, they opted for a package that centred around airflow and cooling. This included an updated sidepod and roll hoop, alongside new brake drums and a rear wing that utilised more downforce.

However, these refinements came with a cost. Only one driver would receive the package this weekend due to the lack of time to prepare the components with a busy racing schedule throughout the month of July. Arvid Lindblad was selected as the lucky driver to test the upgrades in Belgium, with Liam Lawson set to obtain them next weekend in Budapest.

The difference between the two drivers was noticeable, with Lindblad finishing ahead of Lawson in every session —including the race—  proving the impact of the new upgrades. Lindblad even achieved his best qualifying result of the season, finishing ninth only to be boosted up to seventh on the final starting grid after penalties were applied to other drivers. 

The highlight of the race for the two Racing Bull drivers, however, came in the closing stages of the race when they tussled for position during the midpoint of the race. Despite being teammates, they were unafraid to get their elbows out, with Lawson even cutting across the track at times after Lindblad squeezed him wide.

After the race, Lindblad expressed his enjoyment of the inter-team battles “It was fun. Me and Liam had a good battle. It was pretty fun out there, and then also with Gabi, we were pushing each other on, I think 20, 25 laps really flat out. And that's what racing is about…”

Despite finishing in the points, Lindblad ended up two positions astray from where he started in ninth with Lawson 12th, though he is optimistic about what the future holds, having now tried the new components across a full race weekend. His result also marks his fifth consecutive points finish, an impressive feat for the first half of his rookie season.

“Regardless of the end result, we've done a really good job as a team, especially on my side of the garage. And we've been very fast all weekend, so I’m looking forward to Budapest now.”

<b>Consecutive points finishes for Bortoleto</b>

Before the British Grand Prix, Gabriel Bortoleto —and the rest of Audi— had hit a roadblock, narrowly missing out on points for three consecutive races. The pieces fell into place at Silverstone as he clinched four championship points, adding to the team's tally for the first time since the season opener in Melbourne. All he had to do now was replicate the result, which was easier said than done.

The Brazilian delivered a calm and confident drive from eighth on the grid, battling the likes of Lindblad and Norris en route to his second consecutive points finish of the season. Though it was the multiple virtual safety cars which allowed him to really capitalise on his position, gifting him a pitstop on lap 21, which the pit crew nailed with an impressive 2.5 second stop. 

Whilst he may have brought it home to finish exactly where he started in eighth, a result like this gives a wider insight into Audi’s progression across their first season in F1.  Despite teammate Nico Hulkenberg’s result being unreflective of the team’s overall race pace, Bortoleto is adamant that the future is looking much brighter for Audi.

"These streaks of races with points are a huge boost for all of us. It's a great feeling to know we're in a position to deliver results like this and keep fighting in the top ten. It's where we want to be, where we belong, and we'll keep pushing to get more —starting in Budapest, a week from now, to end the first half of the season on a high note."

As he exited the car in Parc Fermé, he spared a moment to tap his halo lovingly, thanking the car for sticking with him throughout the 44 laps and allowing him to deliver another haul of points for his team.

            `}

            ,"Spa-Race-Recap":{
                title:"Kimi Antonelli Reigns Supreme in Spa Thriller",
                subtitle:"Six wins for the championship leader after surviving a dramatic, penalty-filled race of attrition in Belgium.",
                image:"assets/images/F1/Spa race.avif",
                authorName:"Joseph Worrell",
                authorPic: "assets/images/authors/joseph-worrell.jpeg",
                content: `Round 10 of the 2026 Formula 1 world championship arrived in Spa for the Belgian Grand Prix, and it was Kimi Antonelli on pole position after a stunning lap on Saturday and a dominating run throughout the practice session. Max Verstappen and George Russell would line up in 2nd and 3rd after a grid penalty for Norris dropped him to P13. 

Antonelli won the start and held off Max Verstappen into turn 1 but it was the Dutchman who eventually got through into Eau Rouge before Kimi got him back down the Kemmel straight; a thrilling exchange between the pair on the first lap. But it was George Russell and Lewis Hamilton who were the centre of controversy on the first lap when Hamilton overtook his old teammate down the Kemmel straight only for Russell to outbrake him into Les Combes going around the outside. However, there was only enough room for one, and the pair made contact, putting Russell into a spin and out of the race. With the Mercedes stranded in the gravel, this brought out the safety car and the FIA later deemed Hamilton at fault for the incident leaving him with a 5-second penalty as well as minor front wing damage. Russell would go on to say that it was a “racing incident” in the media pen after the race. 

The lap 1 chaos didn’t end there though, as the two Haas’ also came to blows with Bearman making contact with Esteban Ocon as he overtook him around the outside into Les Fagnes chicane, leaving the Frenchman with a front left puncture and needing to pit for repairs. 

The safety car period ended at the end of lap 4 and we went racing again on lap 5 with Oscar Piastri and Lewis Hamilton battling up Eau Rouge for P4 with the Australian winning on this occasion. Kimi Antonelli led from Leclerc and Verstappen, who was on the charge as he looked to restore his second place, and he quickly repassed Leclerc down the Kemmel straight. Meanwhile, Lando Norris was already up to ninth. 

By lap 8, it was Oscar Piastri who now looked to pass Charles Leclerc as they headed down the Kemmel straight with the Monogasque going defensive. The Australian went to the outside but the pair tangled as Leclerc moved back over. Luckily, both were able to continue with minor front wing damage to the McLaren and no further action for Leclerc who escaped a penalty. 

After getting past Piastri, Lewis Hamilton set about getting past his teammate Charles Leclerc, but the latter stood firm and defended hard against his teammate. On lap 18, Red Bull brought Verstappen in for his one and only stop of the race with him rejoining ahead of his teammate in 6th; a brief VSC promoted Mercedes to bring Antonelli in the following lap with the Italian coming into the pits just as the virtual safety car ended, he rejoined ahead of Verstappen in fifth. 

On lap 20, another VSC came out for debris on track and both Ferrari’s took advantage by coming in for their pit stops. Charles Leclerc came out of the pits ahead of Antonelli in second but with Norris yet to pit, he was effectively in the lead of the race. Lewis Hamilton however had to serve his 5-second time penalty which resulted in him coming out in P6, behind Oscar Piastri who also took advantage of the brief VSC. Hamilton was under investigation by the FIA once again however after colliding with a mechanic whilst exiting his pit box, the mechanic was thankfully unharmed. 

By lap 29, Leclerc and Antonelli had both got past Norris who was in P3 and still yet to pit, Max Verstappen then wasted no time in getting past the McLaren driver into Les Combes, leaving Norris in the clutches of his teammate and desperate to pit for fresh rubber. Norris finally got his wish and on lap 31, he boxed for mediums but a slow stop meant the Brit came out in 8th, behind Bortoletto. 

The hunt for the win was thus on, with Antonelli hunting down Charles Leclerc who had so far held onto his lead from the earlier VSC; but by lap 34, Leclerc was defenceless and Antonelli went by on the Kemmel straight, restoring his lead. Meanwhile, Lando Norris had managed to pass Bortoletto for P7 and looked to mount an attack on Hadjar in 6th. 

Despite having another penalty looming over his head, Hamilton looked to challenge Piastri for 4th and was starting to close the gap. Lap 40 came around and Hamilton cruised past the McLaren down the Kemmel straight and moved up into 4th place. 

There was no stopping Kimi Antonelli however, as the Italian took his 6th win of the season and extended his championship lead to 45 points over Lewis Hamilton. Charles Leclerc and Max Verstappen rounded off the podium places with Hamilton and Piastri in 4th and 5th, and Hadjar and Norris in 6th and 7th respectively. An impressive performance from Gabriel Bortoleto found him finishing in 8th place, and Lindblad followed him in 9th after starting from 7th, his best grid position of his rookie season.

A huge swing in the championship for Kimi Antonelli who gained 25 points over his teammate George Russell and a further 13 points on Lewis Hamilton who would keep his 4th place after the team were awarded a fine for the unsafe release rather than another time penalty.
            `}
            ,"F2-feature-spa": {
                title:"Formula 2 Feature Race Recap: Spa-Francorchamps",
                subtitle: "Rafael Camara takes the win in a race dominated by incidents and wheel-to-wheel action.",
                image:"assets/images/F2/feature race spa.webp",
                authorName: "Joseph Worrell",
                authorPic: "assets/images/authors/joseph-worrell.jpeg",
                content: `The Formula 2 feature race at Spa got underway in overcast conditions as Rafael Câmara started from pole position with Tasanapol Inthraphuvasak alongside him; Alex Dunne and Nikola Tsolov would start 3rd and 4rd respectively as they looked to apply pressure early on.

Inthraphuvasak got the jump on Câmara into turn 1 as Dino Beganovic stalled on the grid with Roman Bilinski and Gabriele Mini making contact into the first corner, subsequently bringing out the safety car. The safety car came in at the end of lap 2 and Inthraphuvasak led the pack away but it was Tsolov who looked to gain early places as he tried to go around the outside of Câmara into turn 1, resulting in Tsolov being forced into the gravel and dropping back down to P5.

Nikola Tsolov quickly began to struggle as Varrone and Bennett both got past the Bulgarian into the bus stop chicane. By lap 5 it was Rafael Câmara who took back the lead from Inthraphuvasak down the Kemel straight as Durksen made a move on Dunne behind.

The super soft runners soon began to struggle with Dunne and Inthraphuvasak starting to drop down the order to the drivers who started on the medium tyres. By the end of lap 6, Câmara and Inthraphuvasak dove into the pits to replace their super softs and opted for the medium tyre which they hoped would take them to the end of the race.

Lap 8 came around and the safety car was brought out immediately after Laurens Van Hoepen had an on-track accident on the exit of Les Combes; thankfully the Dutchman was unhurt. On lap 9, the race director decided a red flag was necessary due to damage to the barrier and debris scattered over the track.

The race would be red flagged for upwards of 20 minutes until we finally got a resumption and the top 5 was occupied by Dürkson, Varrone, Bennett, Stenshorne and Maini who still had to pit. 21 minutes remained in the race due to the time restraints and the race got underway with a rolling start. With 17 minutes to go, Câmara and Leon treated us to an epic battle as the two would go side by side into Eau Rouge for what would eventually be the battle for the win.

The safety car was then brought out for a third time as Fittipaldi spun at Les Combes, beaching his car and taking him out of the race. The safety car gave everyone who hadn’t yet pitted a chance to come in and change tyres which meant the top 5 consisted of Camara, Dunne, Leon, Inthraphuvasak and Tsolov. The safety car would eventually come in with just 11 minutes left on the clock and Camara would lead the field away.

Nikola Tsolov would move up to P4 after a move on Inthraphuvasak as he looked to get to the podium places. Alex Dunne continued to apply pressure on Camara but Camara would stand firm and continue to hold a gap of 1 second. There was heartbreak for Noel Leon as the Mexican would pick up a 5-second time penalty, almost certainly dropping him outside the top 8 amidst the close proximity of the field. Alex Dunne also fell foul of the strict track limits as he too picked up a 5-second penalty in the closing stages of the race.

The chequered flag fell as the clock timed out and it was Rafael Camara who took the win with Dunne, Inthraphuvasak, Leon, and Tsolov closing off the top 5 on track; but after penalties were applied, Leon dropped down to P7 and Alex Dunne fell outside of the podium places in 4th.
            `}

            ,"Racing-for-Anthoine": {
                title: "Racing for Anthoine: Remembering the lives lost in the pursuit of speed",
                subtitle: "The paddock unites at Spa to honor the legacy of Anthoine Hubert and the lives that changed the sport forever.",
                image:"assets/images/F1/anthoine hubert.avif",
                authorName: "Eya Amri",
                authorPic: "assets/images/authors/eya-amri.jpg",
                content:`The Ardennes forest has an unmatched ability to look breathtakingly beautiful while hiding an unyielding, solemn weight. As the paddock rolled into Spa-Francorchamps for this year’s Belgian Grand Prix, that weight was felt collectively on Thursday evening. Clad in matching navy t-shirts, members of the F1, F2, and F3 grids gathered on the start-finish straight for the annual "Racing for Anthoine" run. Led by Pierre Gasly alongside Anthoine’s mother, Nathalie, the paddock walked and ran the 7km track, pausing at the top of Raidillon to lay flowers and remember a talent gone far too soon. Seven years may have passed, but the racing community refuses to let his memory fade.

                <b>A Champion's Journey</b>

                Anthoine Hubert was a driver defined not just by raw speed, but by an exceptional, intelligent consistency. His single-seater career ignited in 2013 when he dominated the French F4 Championship on his very first attempt, racking up eleven victories. He climbed steadily through the junior ranks, but it was his 2018 GP3 Series campaign that solidified his status as a future star. In a fiercely competitive grid, Hubert’s calculated brilliance earned him the championship title and caught the eye of the Renault Sport Academy, which granted him full backing for his step up to Formula 2 in 2019.

                As an F2 rookie with BWT Arden, he quickly proved he belonged on the world stage. He captured an emotional and tactical sprint victory in Monaco, followed by a brilliant win on home soil at Paul Ricard. He was a driver on a clear, undeniable trajectory toward Formula 1, making what happened on August 31, 2019, an absolute tragedy for the entire sporting world.

                <b>Shadows Over the Ardennes</b>
              
                The annual pilgrimage to Spa no longer just carries the memory of Hubert. The collective pause on the Kemmel Straight during Thursday's run also paid tribute to Dilano van 't Hoff. The young Dutch talent lost his life at the circuit in 2023 during a waterlogged Formula Regional European Championship race. Van 't Hoff's passing served as a devastating reminder that the dangers of racing in extreme weather conditions remain an ongoing battle, particularly on high-speed stretches where visibility drops to zero.
              
                When talking about the modern era of single-seater safety, the grid also races with the spirit of Jules Bianchi. It has been over a decade since Bianchi’s tragic accident at the water-soaked 2014 Japanese Grand Prix, which ultimately claimed his life the following year. Jules was a prodigious Ferrari Academy driver destined for greatness, and his loss fundamentally altered the sport's approach to driver protection.
              
                <b>The Cost of Speed</b>
              
                The loss of Bianchi, Hubert, and van 't Hoff forced motorsport's governing bodies to look reality in the face. Out of these dark moments came a relentless, aggressive push for safety innovation.
              
                The introduction of the titanium halo cockpit protection device was initially met with aesthetic criticism, yet it has since saved many a life, shielding drivers from flying debris and massive impacts in accidents across the formula pyramid. Coupled with strict modern regulations on fireproof suits that give drivers invaluable seconds to escape engulfing flames, and restructured, energy-absorbing impact structures, the sport is safer than it has ever been.

                As the engines roar through the Belgian hills this weekend, the paddock moves forward, but it does so carrying the names of the ones who helped shape a safer future for the sport they loved.
            `}   
            ,"Quali-Recap-Spa-Francorchamps":{
                title: "Qualifying Recap: Spa-Francorchamps",
                subtitle: "Kimi Antonelli claimed his sixth pole position of the season at Spa after a grid penalty stripped provisional third place from Lando Norris.",
                image:"assets/images/F1/qualifying spa.avif",
                authorName: "Eya Amri",
                authorPic: "assets/images/authors/eya-amri.jpg",
                content:`<b>Q1: Lando Norris in the Lead</b>

Under the unusually dry and cloudy conditions at Spa-Francorchamps, the drivers sat in their garages awaiting the beginning of Qualifying. With Kimi Antonelli dominating the practice sessions, it became a matter of who could bring the challenge to him and fight for Pole position.

Like many of the other teams, Cadillac attempted an intra-teammate slipstream, which succeeded and granted Perez an extra couple of tenths on his teammate Bottas.

Across the field, Lewis Hamilton came out on track, showing the positive results of his team in fixing the car after his crash in Free Practice 3. 

Verstappen crosses the line to bring in a lap time almost 4 tenths away from second place-sitter Antonelli, only for the latter to be replaced by Arvid Lindblad who strung together a stellar lap in the newly-upgraded Racing Bulls who has allowed him to achieve some impressive results throughout the season.

Norris goes fastest ahead of Verstappen with 0.065s, a result that should make him and the McLaren team satisfied if not for the grid penalty that will see him losing 10 grid positions at the starting grid.

With 4 minutes left on the clock, the cars shuffle onto the track. With their finals runs, a handful of drivers improve their lap times while other remain in the relegations zone. Disqualified in Q1 are Alex Albon, Esteban Ocon, the two Cadillacs and the two Aston Martins.

<b>Q2: Tows and troubles</b>

As the session starts, the lap times begin tumbling down. Verstappen displayed a stellar lap with a strong middle sector, crossing the line in second place, behind Antonelli by 0.447s. Behind them is Lindblad in third, as Norris goes second only to be replaced by Leclerc.

With five minutes on the clock, Russell is stuck in 8th place, half a second behind his teammate, raising more questions for him as to his performance.

With three minutes left and the end of the session approaching, drivers attempted to improve their lap times, with personal best sectors all around the track. Eventually, out in Q2 were Lawson, the two Alpines, Hulkenberg, Sainz, and Bearman.

Nico Hulkenberg, who did not make the cut into Q3, stopped on track via a team instruction to stop the car due to a hydraulic leak. The last qualifying session was thus delayed as the marshalls, with the help of Hulkenberg, dragged the car back to the pits.

<b>Q3: Pole Number 6 for Antonelli</b>

After the initial runs, Oscar Piastri picks up some gravel onto the track, causing a red flag that pauses the session as the marshalls attempt to clean the track up from the debris.
After resumption, Norris goes fastest, and would be on pole if not for his grid penalty. Meanwhile, Hadjar kindly offers his teammate Verstappen a tow, allowing him to bank in a fast lap that grants him second place.

With a few minutes left on the clock, Antonelli executes a fabulous lap and goes fastest ahead of Verstappen and Norris. A noteworthy performance is provided by Lindblad who will be starting in 7th place for tomorrow’s race, a best starting position for the young rookie in his first year in Formula 1.

<b>The top 3’s thoughts</b>

<b>Kimi Antonelli (P1)</b>: “We’re able to improve lap-by-lap [...] tomorrow is another day, I have Max starting next to me, and so it’s important to have a good start.”

<b>Max Verstappen (P2)</b>: “[The tow] was definitely helping me, or I would not be here, I would be in P6.”

<b>Lando Norris (Provisional P3)</b>: “We’ve not really changed anything, we’re just quicker here. Unfortunate that we’re not starting here tomorrow, but a good lap for me, so hopefully we can still have a good race tomorrow [...] The car’s obviously performing well, there’s plenty of opportunity.”
`}
            ,"F2-Sprint-Spa":{
                title: "F2 Sprint Race Recap: Spa-Francorchamps",
                subtitle: "A detailed recap of the F2 sprint race at Spa-Francorchamps, highlighting standout performances and unexpected results.",
                image:"assets/images/F2/F2 Sprint Spa.avif",
                authorName: "Joseph Worrell",
                authorPic: "assets/images/authors/joseph-worrell.jpeg",
                content:` Saturday arrived in Belgium for the Formula 2 sprint race and with the top 10 from yesterday’s qualifying session being reversed, it was Montoya on pole with Stenshorne lining up alongside him; Bilinski, Dürksen and Beganovic completed the top 5 respectively.

The 5 red lights went out to signal the start of the 18 laps ahead of us for the sprint race and it was Sebastian Montoya who led them away and held the lead into turn 1 but Stenshorne took the lead around the outside into Les Combes in a thrilling exchange. Further back, Rafael Câmara claimed 2 places to climb from 10th to 8th. Montoya continued to absorb pressure as Joshua Dürkson followed the Colombian closely as the pair closed off the first lap in second and third.

Lap 3 came around and with DRS enabled, the pack continued to close up on each other with Dürkson all over the back of Montoya who stood firm. Roman Bilinski was the biggest loser of the opening lap reshuffle as the Pole lost 6 positions after starting in P3.

By lap 5, Stenshorne was looking comfortable in P1 and had been able to build a gap of 1.5 seconds as he critically had been able to break away from Montoya’s DRS range. After working hard behind Sebastian Montoya for a number of laps, Joshua Dürkson had finally been able to get through into Les Combes and claim second place just before the safety car came out for Cian Shields who crashed after being pushed out onto the gravel by Miyata and subsequently spun into the barrier.

Noel Leon retired from the race on lap 7 after making wholesale changes to the car overnight and would hope for better fortune in the feature race on Sunday. The safety car came in at the beginning of lap 8 and Stenshorne led the pack away for the restart but Dürkson and Montoya were hot on his tail. The Norwegian held his lead but it was championship leader Nikola Tsolov who was looking to make moves and he closed up to Dino Beganovic in 4th.

Further back, Oliver Goethe had managed to pass Inthraphuvasak for 10th place and Nico Varrone was passed by Van Hoepen for 13th. By lap 10, Dino Beganovic sailed past Montoya on the kemmel straight to further dampen the Colombian’s afternoon with Tsolov lurking behind. Stenshorne was being closely followed by Dürkson and by lap 11 was defenceless as the Paraguayan cruised past to take the lead down the straight after Eau Rouge.

With 6 laps to go, the top 5 consisted of Dürkson, Stenshorne, Beganovic, Montoya and Tsolov, all separated by just under a second to the car in front respectively. Rafael Câmara was enduring a frustrating race as he struggled to get past Bennett for 7th but his patience was rewarded when he finally got past the Brit on lap 13. John Bennett’s afternoon would further deteriorate as he suffered a scary high speed spin at Blanchimont later that lap which ended his race and brought out the safety car.

The safety car would stay out until the end of lap 17 and a one-lap shootout would commence with Dürkson ahead of Stenshorne who was looking to restore his lead. At the restart, Tsolov overtook Montoya into turn 1 and then Dunne got through after going side by side into Eau Rouge further cementing a frustrating afternoon for Montoya who had started on pole.

No one was able to pose a threat to Dürkson, though, who held off a late charge from Stenshorne on the last lap to take the win. Dino Beganovic came through to take 3rd place with Tsolov and Dunne rounding off the top 5. Montoya would fall down to P9 on the last lap after being flustered by both Tsolov and Dunne at the restart.
 `         }
           ,"FP-Recap-Spa":{
                title: "Free Practice Recap: Spa-Francorchamps",
                subtitle: "Kimi Antonelli dominated the timesheets for Mercedes at Spa after Max Verstappen put a resurgent Red Bull on top in the opening practice session.",
                image:"assets/images/FP Spa.png",
                authorName: "Tori Turner",
                authorPic: "assets/images/authors/tori-turner.jpeg",
                content:`<b>FP1: Red Bull on top for the first time in 2026</b>

As the drivers took to the track for the first time this weekend, they were met with unusually hot temperatures of 24°C for the circuit that is infamous for its rainfall.

Mechanics huddled around Lando Norris’ car in the opening minutes, preparing the reigning world champion's single-seater after they fitted a new power electronics unit, which teammate Oscar Piastri also received. When he finally left the pitlane, he completed one lap before returning to the garage where they changed the rear brake drums.

Other changes were implemented further down the pitlane as Williams enacted an abnormal switch between their two drivers, removing Carlos Sainz's front wing and handing it over to Alex Albon as the former obtained a spare front wing. 
Williams Team Principal James Vowles explained the decision: “There's been a little bit of a difference between the two front wings, so we're just checking across the two cars.”
 
Whilst undertaking a fast lap, Antonelli came across a sluggish Sainz on the racing line, exclaiming over the radio: “What an idiot!” It was clear the Spaniard was unaware of the Mercedes, though the excuse will make no difference to Antonelli, who had his lap compromised as a result. 

Isack Hadjar initially set the pace for the rest of the field, despite complaining about the setup of his car: “My legs are touching my hands. I have less clearance than usual. It's a bit weird.” Midway through the session, Antonelli went fastest overall, after his earlier impediments, before Verstappen and Hadjar returned to the top. 

With less than two minutes to go, Piastri encountered issues, momentarily stopping at the side of the track before slowly limping back to the pitlane with encouragement from his race engineer: “Keep driving slowly, we have hydraulic pressure. I will update you when we lose it, keep going slow and careful.”

The session came to a close with Verstappen leading the way, followed by Ferrari drivers Lewis Hamilton and Charles Leclerc. Early indications point towards Red Bull returning to their former glory at the circuit, having a crucial advantage in the middle sector, alongside reverting to a previous model of front wing after issues in previous rounds. 

<b>FP2: Antonelli fastest over Norris and Verstappen </b>

A wash of intermittent rain cooled the track in between sessions, giving the drivers a new experience out on track with the weather looking to be dry and sunny throughout the rest of the race weekend. 

The session began with Oscar Piastri watching over his mechanics, who were still working to repair the hydraulic issue that had presented itself at the end of FP1. His car was nowhere near ready to head out onto the track, having been stripped bare as they worked on all the individual components. 

The two Mercedes were the first out on track this afternoon, though it was Antonelli who went to the top early on, seemingly back to his normal form after he finished sixth in FP1. Despite only being three thousandths away from Antonelli, Max Verstappen was quick to complain about the car’s shifting with several expletives on the radio:  “It’s unacceptable, this. My god!” 

Twelve minutes into the session, a red flag halted running due to a large amount of gravel being kicked up onto the tarmac down at Stavelot. When track action resumed, Piastri’s car was finally ready to head out and catch up on the missed runs. 

The frontrunners switched over to the soft compound during this period, unlocking more representative results from the likes of Antonelli, who was now four tenths faster than Verstappen. More worryingly, George Russell was over a second behind his teammate, seemingly struggling on every compound Mercedes had given him thus far.

With less than fifteen minutes to go, another red flag stopped the session after Pierce Gasly caught the barrier several times at Les Fagnes, resulting in a nasty shunt that wrecked the rear of the Alpine and left debris scattered across the track. It was a tight squeeze to the finish line when the session finally resumed, with only two minutes left.

Antonelli remained fastest overall, with Norris trailing him by just under two tenths, indicating that the switch to the new Mercedes electronics unit was more than beneficial. Despite his earlier complaints, Verstappen found the pace to finish third, with the results still looking hopeful for Red Bull.

<b>
FP3: Antonelli sets the pace
</b>
As the cars begin to leave the pis onto the rack, Sergio Perez, who had his best qualifying result in Silverstone with a P14, already struggled with his car:
<i>
“There was some hesitations on the engine”
“Copy, we are looking into this”
“This feels quite weird”
</i>
Lindblad, driving the sole upgraded Racing Bulls, sets a good lap time to slot his single-seater in provisional first place, before his teammate Liam Lawwson sets the fastest time.

Lewis Hamilton, who has in the past been very successful at Spa with 5 race wins, goes out on track and sets the fastest lap by 71 milliseconds. It is then a game of musical chairs between Lindblad and Hamilton as the former sets the fastest lap again only to be replaced by the latter at the top of the charts.

Leclerc, just coming off of a victory in Silverstone, seemed to be struggling to find the pace his teammate has succeeded in finding, setting a lap time half a second off Hamilton’s.

Crisis strikes for Isack Hadjar who loses power and stalls in the pit lane; to make matters worse, the team is unable to move his Red Bull back into the box. 

On the other end of the pitlane, Antonelli finally leaves his garage and is absolutely flying through the track as he sets a lap time almost 8 tenths clear of Hamilton.

Once his power issues are resolved, Hadjar sets his sights out on the track to go for another lap, only to find himself impeded by Lance Stroll’s Aston Martin, a movement the Frenchman is not pleased with as he raises his hand from the cockpit in frustration.

An honorable mention goes to Audi, who finished the session in 8th and 9th, with a strong chassis and an improving form.

In the final moments of the session, Lewis Hamilton goes onto the gravel, hitting the barriers with his rear right tyre, sustaining some damage to his rear suspension, and putting an end to the session with a yellow flag.
           `},
            "F2-Quali-Spa":{
                title: "F2 Qualifying Recap: Spa-Francorchamps",
               subtitle: "A detailed recap of the F2 qualifying session at Spa-Francorchamps, highlighting standout performances and unexpected challenges.",
                image:"assets/images/F2/F2 quali spa.jpg",
                authorName: "Joseph Worrell",
                authorPic: "assets/images/authors/joseph-worrell.jpeg",
                content:`Formula 2 qualifying got underway in damp and drizzly conditions at Spa as the Arden Forest looked to throw an early spanner into the works.

The red flag came out after just 6 minutes, however, after Noel Leon spun at the top of Eau Rouge and subsequently stopped on track shortly after. The Mexican made it back to the pits but remained under investigation from the FIA for bringing out the early red flag.

The red flag lasted for 6 further minutes before the session would then be resumed and it was Alex Dunne who set the early pace with a 1:57.124, 0.265 seconds faster than Nikola Tsolov who was the second fastest car behind.

With 18 minutes remaining in the session, the weather had begun to clear up and as expected, the sector times began to tumble as drivers found more pace. Rafael Câmara put in a lap good enough for P2, still a mere 0.223 tenths off Dunne who was still the man to beat. With 14 minutes to go, the top 5 consisted of Dunne, Câmara, Tsolov, Goethe, and Kush Maini rounding off the top 5, 6 tenths away from Alex Dunne.

10 minutes remained in the session and it was Alex Dunne who led the pack out to set their final runs but with the slipstream being so powerful around the famous Spa circuit, the battle to not be at the front begun as Dunne tried to shake the pack by going into the pits… only for everyone else to follow him in trying to avoid leading the way and therefore providing a slipstream.

As the clock continued to tick down with less than 5 minutes remaining, the yellow flag came out for Laurens Van Hoepen who stopped out on track down the start/finish straight. The red flag was brought out for a second time in the session with 3 minutes and 26 seconds remaining, leading to all cars coming back into the pits unsure whether the session would be resumed. During the yellow flag period, Noel Leon who was on a fast lap had managed to put a lap in good enough for P4 which unfortunately for him was deleted due to the track being under double yellows putting him back down in P17.

The session resumed with just over 3 minutes left on the clock and the rush to exit the pits was on as Noel Leon and Nikola Tsolov led the way. With the track ever improving, lap times started to drop and drivers were finding time. Tsolov briefly took provisional pole but it was Câmara who quickly dispatched him. Dunne could only improve to P3 on his final run and it was Tasanapol Inthraphuvasak who slotted in between them both and took second place.

The final top 5 for qualifying ended with Câmara leading the way with Inthraphuvasak less than a tenth behind. Dunne and Tsolov will both be disappointed with 3rd and 4th respectively but John Bennett rounded off the top 5 for Sunday morning’s feature race.
`}
            ,"Lady-LightsOut-An-Untimely-return":{
                    title: "Lady LightsOut: An Untimely Return",
                    subtitle: "Lady LightsOut discusses the shocking news of Horner's return to Formula 1 and the implications for the sport.",
                    font: "'Playfair Display', serif",
                    image:"assets/images/LLO-horner.webp",
                    content:`<i>Dearest Gentle Reader,</i>

                    While the ton is accustomed to the shifting sands of alliance and courtship, there is no playground quite so rife with betrayal, ambition, and sudden re-entrances as the great traveling circus of Formula 1.

                    A mere year ago, the paddock was shaken to its very foundations by the dramatic fall of one of its most prominent leaders, Mr. Christian Horner. After twenty years of holding the reins of the Red Bull stable, and leading them to an enviable bounty of trophies, he was cast out of the kingdom, ushered through the back gates following a tumultuous season of bitter power struggles and hushed accusations.

                    For twelve long months, the fallen chief remained in exile, forced to admire the gardens rather than the grid. Yet, just when we thought the dust had settled over his absence, Mr. Horner made his triumphant, albeit shocking, return to the paddock at last weekend’s British Grand Prix.

                    My gentle readers, he was mobbed like a long-lost hero. Trailed closely by the ever-watchful lenses of the Netflix crews, Mr. Horner paraded through the gates of Silverstone, only to head straight up the stairs of the FIA motorhome to visit none other than the high priest of our governing body, President Mohammed Ben Sulayem.

                    It seems the President is not one for long-held grudges—nor, it appears, is he particularly bothered by the finer points of moral etiquette.

                    When pressed on whether the disgraced chief should be allowed back into our polite society, the President offered a defense that has left the paddock whispering behind their silk fans.
