            "LN4-Fusion":{
                title:"LN4 Fusion: A new racing legacy",
                subtitle:"Lando Norris launches LN4 Fusion to break down financial barriers and build a clear, supportive pathway to Formula 1 for the next generation of drivers."
                ,image:"assets/images/F1/LN4Fusion.jpeg",
                authorName:"Melinda Gaese",
                authorPic:"assets/images/authors/Melinda-Gaese.jpeg",
                content:`“Getting to Formula 1 takes so much more than just talent. LN4 Fusion is about building a race team that can compete with the best in junior motorsport, with great people and a great environment for drivers to develop.”
<i>-Lando Norris.</i>

The road to Formula 1 is long, grueling, and reserved for a select few who possess the rare convergence of raw talent, crucial connections, and perfect timing. Because the path is so unforgiving, initiatives by established drivers to support the next generation are both rare and celebrated.

Lando Norris is taking on that mantle with the launch of the LN4Fusion and LN4Legacy projects. Co-founded alongside CEO Dan Richards, these initiatives are designed to break down financial barriers and provide crucial opportunities for underprivileged young drivers striving to reach the peak of motorsport. The launch press release states: “Lando co-founded LN4 Fusion alongside founding the LN4 Legacy Programme with a shared ambition: to create more opportunities for talented young drivers and build a complete pathway from grassroots motorsport to the doorstep of Formula One.”

Set to compete across key junior categories, including Italian and British F4, the Formula Regional European Championship, and F3, by 2027, the team aims to carry forward Norris’s legacy by nurturing top young talent on their path toward a coveted seat in Formula 1.

Furthermore, it is safe to say that for Norris, this is just another one of these things that just feels right. Right for someone who speaks so openly about mental health. Right for someone who always makes sure to say "girls & boys" when he speaks about his team. 

And now he is giving back again. To his fans, and to all those young drivers that look up to him. He takes his influence, his money, his own personal sponsors and makes something special out of it. Something that leaves an impression for a long time for sure. 

It may be said that launching this racing team represents a nod to all of Norris’ fellow drivers on the grid that would have needed something like this. Drivers that didn’t grow up rich or privileged. Esteban Ocon, Liam Lawson, Lewis Hamilton, just to name a few. Lando wants to make it better. Easier. Wants to open up a path to people that would never come as far as him without the right fundings and people around them.
`}
            ,"Lightson-Kimi Antonelli":{
                title:"Lights On: Kimi Antonelli",
                subtitle:"Meet Kimi Antonelli, racing prodigy from Bologna, and the current racing sensation you should be following closely."
                ,image:"assets/images/F1/lights on kimi.jpg",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`He is 20 years old and, in only his second season, is currently leading the Formula 1 World Championship. Born in Bologna, Italy, to a sportscar racing driver father, Andrea Kimi Antonelli was destined for success.

In 2019, at just 12 years old, Antonelli joined the Mercedes Junior Team. He advanced through junior series at a rapid pace, which culminated in a season of Formula 2 in 2024. That same year, he served as the test driver for Mercedes’ F1 team. He had an opportunity to drive in the first free practice session during the 2024 Italian Grand Prix. Antonelli set the fastest lap time early on but spun out after about 10 minutes and was unable to complete the session.

When Lewis Hamilton announced his shock departure from Mercedes for the 2025 season, all eyes were on Antonelli. Critics said that he was too inexperienced and needed to spend more time in F2. Others suggested placing him at a lower-ranked team to have a few years to get adjusted to F1. This would have mirrored George Russell's career, as he spent three years at Williams before his promotion to Mercedes.

Despite objections, Antonelli was given the coveted Mercedes seat at just 18 years old. On his debut, he finished in fourth place; this feat makes him the third-youngest points-scoring driver in F1 history. He ended the season in seventh place, scoring 150 points and three podiums.

His first race win was at the 2026 Chinese Grand Prix, and he has won five more races since. He currently leads the championship and sits 59 points ahead of Russell. Antonelli has also been on the podium at almost every race this season, only missing out twice.

Even though he has only competed in F1 for two seasons, he will go down in the history books as the youngest driver to be on pole position, the second-youngest race winner, and the third-youngest to compete in a race. 

The young Italian is beating drivers decades older than him who have much more experience. Even though his name is unrelated to 2007 champion Räikkönen, Kimi Antonelli may soon be a world champion himself, and all eyes are on him as he chases his first title.
`}
            ,"Lightson-Artists-Gab":{
                title:"Lights On Artists: Gab",
                subtitle:"We’re sitting down with Gab, the brilliant mind behind our official Italian Grand Prix race week poster."
                ,image:"assets/images/lightsonartists/gab.png",
                authorName:"Melinda Gaese",
                authorPic:"assets/images/authors/melinda-gaese.jpeg",
                content:`Meet Gab, lifelong ferrari fan, self-taught artist, and the creative brain behind some very impressive artworks. For Gab, F1 has always been more than just a sport. Growing up in an Italian household, it is safe to say the love for Ferrari runs in her blood. 

<b>Get to know her</b>
<i>Could you briefly introduce yourself and tell us a bit about yourself? Also your favourite team/driver and how long you‘ve been a fan? </i>
Hi, I’m Gab and I am a massive F1 fan. I have loved F1 since I was a little girl, first getting introduced to it through my mum and dad’s love for the sport. I remember watching those 2 little red cars on the screen each weekend and being obsessed with them! 
With Italian parents, who I supported was pretty set for me since birth and honestly I wouldn’t have it any other way. Supporting Ferrari is insane, it feels less like a sporting team and more like a family. Being in Italy during any Grand Prix weekend is even better. Everyone comes together to watch and support Ferrari, it's an amazing experience!!
I have always been pretty artistic as a child, drawing and painting are some of my earliest memories. When my love for the sport grew as an adult I wanted to appreciate it through something I could be a part of, so I decided to embrace my love for it through my artwork. 

<i>What came first for you: your love for Formula 1 or your art? </i>
My love for art definitely came first, I was obsessed with drawing already at the age of three! Progressively I became better and more confident in trying to paint F1 inspired artworks

<i>Is there one F1 moment you will never forget? </i>
My own personal F1 moment I will never forget has to be my first time at a race, hearing the cars in person was an experience like no other!! I remember seeing Charles and Lewis for the first time, my boyfriend had put me on his shoulders and I was shaking from excitement of being so close to my idols and knowing potentially they saw me too!
Another F1 moment I will never forget has to be watching Charles Leclerc win at Silverstone 2026! I was lucky enough to be there, and remember the pure relief, seeing him cross first and watching his pitstops pay off in real time!

<b>About her art</b>
<i>What inspired you to draw f1 pieces? </i>
I started collecting unique Ferrari pieces, and some of them were Michael Schumacher plates. These were plates with beautiful artwork of Schumacher across different tracks. The artwork inspired me to also give it a go! Instead of immediately trying to recreate artwork of F1 cars (which is pretty tricky). I decided to stick to something I was more familiar with, so I began painting portraits of F1 drivers. Eventually I gained confidence and experimented with different forms of artwork including embroidery, spray paint, pottery and of course paint!

<i>Which piece are you most proud of, and what makes it special to you? </i>
Choosing one I am most proud of is very tricky! I am proud of all of them for many different reasons. I love my Michael Schumacher acrylic painting because it was my first ever big piece, and within making the artwork I was able to pay respect to a big Ferrari idol of mine! 
My front wing art piece is also a favourite of mine for the opposite reason! It is such a small surface area to work on and I found it so tricky to get any details in the piece. My front wing is inspired by the first ever F1 gp I went to! It is based on a photo I took at the Austrian GP with Spielberg and the beautiful Austrian hills in the background. This piece has a special place in my heart as it also brings back amazing memories.
I also really love my oil paintings of Lewis Hamilton and Fernando Alonso! These are my favourite to make as there is so much colour to add and they are very fun to paint in general. 
I also try to challenge myself artistically when it comes to F1, there is so much you can do to celebrate the sport! I love trying out different pottery art work with mugs and plates. This is unusual for F1 artwork but it turns out beautiful. I have also attempted to embroider a Ferrari onto a top. This I must say I was very proud of —after pulling the beads off and re-starting maybe 5 times!!! 

<i>Is there a driver, car, circuit, or historic moment you still dream of creating a piece about?</i>
I would love to create a piece around Sebastien Vettel or Ayrton Senna one day! 

<i>And is there anything you wanna tell artists that are just getting started? </i>
Find something you love outside of art then bring it into art, your paintings will get better if you truly enjoy what you are painting!

<i>You normally paint in the conventional way, for the race weekend poster you challenged yourself in digital art. How different was it? </i>
For the race weekend poster I tried digital art for the first time which was very hard for me. Its a much smaller scale than I am used to and being able to zoom into areas I wanted to add more detail to felt very odd! I enjoyed creating it, but for now I will stick to what I know, paint and a canvas!

<i>What has been the most meaningful reaction you have received from a follower or even a driver/team?</i>
When I created a painting of Fernando Alonso, Aston Martin commented under a post of it. This was the first time my art was loved by a F1 team, and the feeling was amazing.
The love I get from my followers when I post a video of my artwork is always so overwhelming. It means the world to me that people love my work enough to request to even purchase it in some cases! 

<i>What are you currently working on? Where can people find and support your work?</i>
Currently, I am working on a few pieces. One being an oil painting of Charles and Lando celebrating on the podium! The other an oil painting of Schumacher during a Pit Stop. I am excited to share the final product with everyone! To support my work people can find me on TikTok: @gabtalksformula1 or my art website I will be launching soon! (Link in my tiktok) 

<b>Quick-fire questions</b>
Favourite circuit to watch? Singapore 
Favourite circuit aesthetically? Spielberg
Day race or night race? Night
Wet or dry race? Wet
Monaco glamour or Silverstone hype? Monaco glamour
One current driver you would love to gift an artwork to? Lewis Hamilton
Describe yourself in three words. Creative, loving, and adventurous 
Which colour represents your art? Red
`},            
            "History-Driver-Academy":{
                title:"Let's Torque History: Driver Academies",
                subtitle:"We cover the paths of a handful of drivers who were part of driver academies and development programmes, and how their careers have progressed since then."
                ,image:"assets/images/history/driver academy.jpg",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`To support young drivers, many Formula One teams create driver academies or development programmes. These allow those in lower formulas to establish connections to F1, as well as offer financial support and opportunities to test higher-level machinery. 

Driver academies and development programmes typically sign drivers when they are young teenagers; the goal is an eventual promotion to their F1 team. While this is the case for some drivers, others decide to sign with a different team and sever all ties with their driver academy.

<b>Charles Leclerc</b>

Charles Leclerc was signed to the Ferrari Driver Academy in 2016 while competing in the GP3 Championship. That same year, he was the development driver for Ferrari and the test driver for Haas. In 2017, he competed in Formula 2, while also being the test driver for Ferrari and Sauber, a team that used Ferrari engines. One year later, and after winning the F2 title, Charles began his Formula One career with Sauber. Following an impressive rookie season, he was promoted to Ferrari for 2019. He won twice that year, at the Belgian Grand Prix and Italian Grand Prix, and was subsequently named “Il Predestinato.” He signed a multi-year contract earlier this season with Ferrari and will continue with the team for the foreseeable future.

<b>Mick Schumacher</b>

Mick Schumacher joined the Ferrari Driver Academy in 2019 during his stint in Formula 2. His dad, seven-time world champion Michael, won five championships with Ferrari in the 2000s; the team has a special connection with the entire Schumacher family. In 2020, Mick became the test driver for Alfa Romeo and Haas, as both of these teams used Ferrari engines. In 2021, Mick started in Formula One with Haas and was also the reserve driver for Ferrari. These roles continued until the end of the 2022 season, when he lost his Haas seat and parted ways with the Ferrari Driver Academy. He subsequently became the reserve driver for Mercedes and McLaren in 2023. The following year, he continued as Mercedes’ reserve driver. He has since competed in the World Endurance Championship and IndyCar and is not currently affiliated with an F1 team.

<b>George Russell</b>

George Russell became a member of the Mercedes Junior Programme in 2017 during his time in GP3. In 2018, while competing in Formula 2, he was the reserve driver for both Mercedes and Force India, a team that used Mercedes engines. After winning the F2 championship, he made his Formula One debut with Williams, another team with engines made by Mercedes. George remained at Williams for three years, with a one-off appearance in a Mercedes in 2020 to replace an ill Lewis Hamilton at the Sakhir Grand Prix. He was signed to Mercedes in 2022 and has since won seven races. He has recently confirmed that he will be staying with the team at least through next season.

<b>Esteban Ocon</b>

Esteban Ocon joined the Mercedes Junior Programme in 2015 while he was part of the GP3 series. One year later, he began in Formula One with Manor Racing, a team that used Mercedes engines. He then switched teams, driving for Force India, another customer of Mercedes engines, for both 2017 and 2018. At the end of the 2018 season, Esteban lost his seat after Force India was sold. The following year, he was Mercedes’ reserve driver as he tried to find an open seat on the grid. He eliminated all ties with Mercedes after 2019, which allowed him to pursue an opportunity with Renault, later rebranded to Alpine. He currently drives for Haas and does not have a relationship with Mercedes.

<b>Oscar Piastri</b>

Oscar Piastri joined the Renault Sport Academy, later rebranded to Alpine Academy, in 2020 when he was in Formula 3. That same year, he was a test driver for Renault. In 2021, when Renault changed its name to Alpine, they kept Oscar as their test driver. He won the F2 championship that season, but there were no F1 spots open for him for the following year. As a result, he spent 2022 as a reserve driver for both Alpine and McLaren. When Fernando Alonso announced that he would be driving for Aston Martin in 2023, Alpine had an opportunity to promote Oscar. The team made a premature announcement, which was followed by a viral tweet from Oscar that said he would not be driving for them. After a contract dispute, Oscar was officially announced as a McLaren driver, and he cut all ties with Alpine. He has been at McLaren since 2023 and is contracted to stay through 2028.

<b>Jack Doohan</b>

Jack Doohan joined the Alpine Academy in 2022 while competing in Formula 2. The following year, while still in F2, he became Alpine’s reserve driver. He continued the role of reserve driver in 2024 and drove in the season’s final race in Abu Dhabi. He gained a full-time seat for 2025 but was replaced after six races by Franco Colapinto. Jack is currently the reserve driver for Haas and has no relationship with Alpine.

<b>Max Verstappen</b>

Max Verstappen joined the Red Bull Junior Team in 2014 while competing in Formula 3; that same year, he also served as the test driver for Toro Rosso, Red Bull Racing’s second team. In 2015, he made the step up to Formula One with a seat at Toro Rosso. One year later, he was promoted to Red Bull Racing; he won on his debut with the team. He has since remained at the team, winning four world championships and 71 races. He recently signed a contract that will keep him at Red Bull Racing until the end of the 2030 season.

<b>Pierre Gasly</b>

Pierre Gasly joined the Red Bull Junior Team when he was in Formula Renault 3.5 in 2014. He continued to progress through the junior series with Red Bull’s support. In 2015 and 2016, he was the reserve driver for Red Bull Racing and the test driver for Toro Rosso. He replaced Daniil Kvyat at Toro Rosso midway through the 2017 season and was able to secure a full-time seat for 2018. One year later, he got a chance to drive for Red Bull Racing but was demoted back to Toro Rosso after only 12 races. He stayed there for three and a half more years; the team changed names during that time and became AlphaTauri. Pierre officially cut all ties with Red Bull at the end of the 2022 season so that he could sign a contract with Alpine; he has plans to stay with Alpine through the 2028 season.

While some driver academies and junior team partnerships are successful, others result in drivers pursuing different opportunities or leaving Formula One before they earn a promotion. Even though they are not perfect or a guarantee for a future seat, these programmes give young talent a wide variety of resources and help them navigate a career as a racing driver.
`},
            "3-things-you-missed-Dutch-GP":{
                title:"3 Things You Missed: Dutch Grand Prix",
                subtitle:"3 things you missed at the final Dutch Grand Prix, from pit stop chaos to standout performances and close shaves."
                ,image:"assets/images/F1/3 things zandvoort.jpg",
                authorName:"Melinda Gaese",
                authorPic:"assets/images/authors/melinda-gaese.jpeg",
                content:`This weekend we said goodbye to one of the most legendary tracks on the calendar - the dutch gp. And it said goodbye with a bang. Max crashed in front of his home race crowd, Liam avoiding him in the last moments. Lando brought home a back to back win and the papayas secured another chunk of points for Mclaren. One of the biggest discussions was probably the call Mercedes made for George. Goodbye papaya rules, hello silver arrow rules. With all these things going on, it was easy to overlook smaller moments that made this race so interesting. From messy pit stops, to questionable strategies, to Yuki Tsunodas perfomance in the Vcarb. 

<b>Yuki Tsunodas performance </b>

Despite getting the call close to the weekend, Yuki Tsunoda proved to everyone with his performance that he is not only hungry, but deserves a permanent seat in F1, fighting the pressure of this short handed call in. It was his first time driving this new generation of cars and he still finished 11th, just outside the points, after qualifying 12th. Especially his overtake on Pierre Gasly was impressive and definitely needs more recognition. With many teams still not securing their line ups for the next season, we may see a comeback. What makes the whole weekend even more impressive is the fact that Yuki Tsunoda had barely time ti settle into the car. There is a huge difference between getting Weekend after Weekend to learn and just getting basically one free pratice session. 

<b>Pit Stop Chaos </b>

The dutch grand prix was the grand prix of the slow pitstops. Mclaren’s first pitstop for Oscar Piastri counted 5.4 seconds on the clock - a pitstop that was meant to cover George Russell, followed by another long stop for Lando Norris before the crew could find their groove (2.9 seconds for another Oscar Piastri stop). Similar pictures paint the other pitstop times, like 3.1 for Lewis Hamilton or 4.6 seconds for Kimi Antonelli, 3.5 seconds for Charles Leclerc. In a fast paced world like this, stops that take 4.6 or 5.4 seconds can feel like a eternity, especially if they are a important factor in gaining or losing track position 

<b>Gabi and Nico almost crash </b>

Right before Max Verstappen crashed his RB into the wall because he spun out, Gabriel Bortoleto did a 360 on track, was thankfully able to catch the car before something worse happened. And you could say the same about Nico Hülkenberg. It was probably a millisecond decision that not only saved him, but also his teammate. Similar to Isack’s reflexes we saw back in f2 when he avoided to crash into another driver in Monaco, Nico saved the situation with a fast decision, telling his engineers that he almost t-boned Gabi. That shows us, again and again, how important good reflexes and fast decision making are in this sport. One small delay could change the whole outcome of a situation. 
`},
"F1-Race-Recap-Dutch-GP":{
                title:"Race Recap: Dutch Grand Prix",
                subtitle:"Lando Norris claims his second win from pole in a row at the Dutch Grand Prix."
                ,image:"assets/images/F1/zandvoort race.jpg",
                authorName:"Ellie Roddy",
                authorPic:"assets/images/authors/ellie-roddy.jpeg",
                content:`The Dutch Grand Prix delivered a chaotic race at Zandvoort, with multiple incidents, penalties, retirements, and plenty of battles throughout the field. Lando Norris ultimately took victory after a late-race charge, while Kimi Antonelli and George Russell completed the podium.

Sergio Perez started the Dutch Grand Prix from the pit lane after Cadillac changed the suspension setup on his car under parc fermé conditions without approval from the FIA Technical Delegate.

An extra formation lap was required before the race finally got underway. At the start, Norris held onto the lead, while Antonelli made a strong launch to move into second place ahead of his Mercedes teammate Russell.

However, the opening lap quickly turned dramatic. Max Verstappen crashed into the wall at the final corner, bringing his home race to an early end. Verstappen confirmed over the radio that he was okay, saying, “I’m ok,” before adding, “Yeah, that’s it. Ah ****, sorry.”

The crash left a significant amount of debris across the circuit, forcing the race director to deploy the red flag. Gabriel Bortoleto also had a spin behind Verstappen, but he managed to keep his car running and continued in the race. Elsewhere, Lindblad and Colapinto were investigated for overtaking under yellow flags, adding further uncertainty to the early stages of the race.

After the restart, Oliver Bearman stopped between Turns 10 and 11. It appeared to be a technical problem rather than a crash, with the Haas driver reporting over the radio, “Everything broke, everything turned off.” This caused another interruption and another formation lap before racing could resume.

When the race finally got back underway, the battle at the front remained intense. On lap five, Norris and Antonelli went wheel-to-wheel into Turn 1, with Antonelli making the move stick and taking the lead from Norris. Oscar Piastri also gained a position, moving into third after passing Russell. Meanwhile, Colapinto and Lindblad’s earlier investigations yielded drive-through penalties for their yellow-flag infringements.

Russell then found himself involved in a battle with the two Ferraris for fourth, fifth and sixth. The Mercedes driver remained focused on strategy and told his team over the radio to “Consider original plan A.”

The pit-stop phase began to shake up the order. On lap 18, Russell came into the pits for a fresh set of tyres. Piastri also stopped, but his pit stop was slower than expected. Russell was able to take advantage of the delay and emerged ahead of the McLaren to move into sixth.

On lap 22, Antonelli, Charles Leclerc and Norris all made their pit stops. However, all three appeared to lose valuable time during their stops, keeping the fight at the front and through the midfield extremely close.

Between laps 24 and 27, the midfield continued to provide plenty of action. Carlos Sainz found himself holding up a group of cars, while Pierre Gasly managed to pass Lindblad. Gasly then had a small moment that allowed Nico Hulkenberg to get through, with the Haas driver also passing Lindblad. On lap 29, Gasly was overtaken by his former teammate Yuki Tsunoda. The battles continued to develop as the drivers attempted to gain every possible position.

Leclerc moved past Piastri for fourth place on lap 34, while Hamilton followed him through a lap later to take fifth. Hamilton was unhappy with one of Piastri’s moves and described it as “quite dangerous” over the team radio.

By lap 43, Hamilton was becoming increasingly frustrated with Ferrari’s strategy. He believed the team was losing valuable time by not putting Leclerc onto new tyres. Hamilton said, “We’re losing time,” before later adding, “Great way of losing time. Good job!”

The retirements continued on lap 49 when Lance Stroll was forced to bring his race to an early end. Three laps later, Antonelli reported a major issue with his rear tyres after being asked to go wide at Turn 10. Despite the problem, he continued to fight at the front.

On lap 54, Norris made his move on Antonelli and overtook him for second place. Just a few corners later, Norris passed Hamilton to reclaim the lead of the race.

The race was interrupted once again on lap 55 when the Virtual Safety Car was deployed after Esteban Ocon stopped at Turn 3.

Hamilton’s frustration with Ferrari boiled over during the VSC. He asked over the radio, “Are you using me as a guinea pig, or what the… what’s going on?!” He then questioned the team about how long he would remain out on track, asking, “How long will you have me stay out?!”

The Virtual Safety Car ended on lap 58, with Norris still leading the race. From laps 59 to 64, the midfield continued to produce several battles, with drivers making routine overtakes and fighting for positions. Valtteri Bottas eventually retired from the race, adding another name to the list of non-finishers.

Russell and Antonelli then swapped positions as the Mercedes drivers continued their battle. Russell questioned his team over the radio, asking, “Is he fighting for the win?”

The drama continued on lap 67 when the two Williams drivers came together and made contact. Both cars were involved in the incident, while Colapinto was later handed a 10-second time penalty for his second yellow-flag infringement.

On lap 69, Hamilton and Russell battled for third place. Russell managed to defend his position and kept Hamilton behind him.

Another Virtual Safety Car was deployed on lap 70 because of debris on the circuit. Liam Lawson was given a 10-second time penalty for a yellow-flag infringement. Further down the field, Alex Albon subsequently retired from the race, while his teammate Sainz was handed a 10-second penalty for causing a collision with Albon.

As the closing stages approached, Russell found himself in a fierce fight with both Ferraris for second, third and fourth. The Mercedes driver was under increasing pressure as Leclerc and Hamilton attempted to gain positions.

After a race filled with incidents, strategy changes, and battles throughout the field, Norris held on to take the win. Antonelli finished second, while Russell completed the podium in third.
                `},

"F1-Qualifying-Dutch-GP":{
                title:"Qualifying Recap: Dutch Grand Prix",
                subtitle:"A rejuvenated Lando Norris claims pole position at the Dutch Grand Prix qualifying."
                ,image:"assets/images/F1/zandvoort quali.webp",
                authorName:"Joseph Worrell",
                authorPic:"assets/images/authors/joseph-worrell.jpeg",
                content:`Qualifying for the final Dutch Grand Prix at Zandvoort got underway in bright and sunny conditions after a rain shower hit the circuit at the end of the sprint race. It was Mclaren and Oscar Piastri who looked strongest in Q1 closely followed by George Russell in P2. With less than 2 minutes to go in the session, Bortoletto, Bearman, Ocon, Bottas, Perez and Lance Stroll were all in the elimination zone and at risk of getting knocked out. With the track ever improving, the pressure was on for the drivers at risk to get a lap in and improve their time and it was Bortoletto who put in a lap good enough for P10, ensuring that he progressed to Q2. The bottom 6 who would go on to get knocked out in Q1 were Sainz, Alonso, Stroll, Bearman, Bottas and Perez. Alex Albon and Esteban Ocon would breathe a sigh of relief as they both squeezed through by the finest of margins.

In Q2 it was once again McLaren setting the early pace with Norris in P1, closely followed by teammate Oscar Piastri, a strong showing for McLaren who looked to put a disappointing first half of the season behind them. Mercedes so far had seemed to be off the pace with Antonelli and Russell in P5 and P6 respectively and they hoped that they could find time in Q3. The bottom 6 and knocked out at the end of the session were Gasly, Tsunoda, Hulkenburg, Colapinto, Ocon and Albon. Tsunoda impressed and put in a great lap to line up P12 considering his late call up to Racing Bulls to replace Lawson, who was in turn replacing an injured Hadjar at Red Bull. Meanwhile, Albon was disappointed with 16th as Williams’ dismal season continued.

As Q3 came around, clouds were forming and teams looked to send their drivers out early to ensure they didn’t get caught out with rain interruptions. Norris looked to carry his Q2 momentum into the final part of qualifying and put his car onto provisional pole closely followed by Russell and teammate Oscar Piastri. With 4 minutes left in the session, the predicted rain began to fall and drivers were all left scrambling to get a final lap in. The track however was still dry enough for drivers to improve on their laps and it was Antonelli who went to the top of the time sheets with a great lap but he was quickly beaten by Norris who restored his pole position. George Russell put in a lap good enough for P2; crucially, a lap that put him ahead of Kimi Antonelli. Liam Lawson also impressed as he made it through to Q3 against the odds and put his Red Bull only 1 tenth away from temporary teammate Max Verstappen as both Red Bulls line up P7 and P8. Both Ferraris improved at the end of Q3 but could only manage P5 and P6 with Lewis Hamilton leading their charge albeit over 3 tenths away from pole position. 

The final classification was Norris on pole with George Russell and Antonelli rounding out the top 3. Piastri, Hamilton and Leclerc line up behind them with both Red Bulls occupying the 4th row of the grid. Bortoletto and Arvid Lindblad would both round out the top 10.  
`},
"F1A-Feature-Dutch-GP":{
                title:"Formula 1 Academy: Feature Race at the Dutch GP",
                subtitle:"Palmowski claims her fourth victory of the season in an exciting Feature Race at Zandvoort."
                ,image:"assets/images/F1 Academy/DUTCH GP FEATURE.avif",
                authorName:"Eya Amri",
                authorPic:"assets/images/authors/eya-amri.jpg",
                content:`Lights out spells a rough start for Palmowski leading to a close fight with Alba Larsen who kept her rival under pressure and attempted an overtake on lap 2 that prevailed as unsuccessful. Behind the pair, Nina Gademan has an inside-line touch with Granada at the race start, with an attempt to move up the field for Gademan that proves successful as she takes third place. 

Fifth place Felbermayer tries to take on a battle with Granada, ending with a close contact with the latter.

By lap 8, Alba Larsen shaves the gap to Alisha Palmowski to 0.1 seconds and begins calculating her chances for an overtake opportunity, and her pitwall affirms her efforts with an encouraging radio message: “Good job, she’s starting to struggle.” 

Ella Lloyd in eighth place takes her chances on an overtake on Rachel Robertson, with her radio message stating a strong: “You’re getting closer, cone on let’s move.” 

At the front, Palmowski pulls aways from the field as she extends her gap to second place to a hefty 1.5 seconds, snatching the fastest lap of the race. By the final lap, the gap extends to 2.3 seconds.

Alisha Palmowski claims the checkered flag and her fourth race win of the season as well as the fastest lap of the race. Alba Larsen gets her second podium, two days in a row. The home hero Nina Gademan finishes in third, rounding out the podium positions.
                `},

            "F1A-Reverse-Grid-Dutch-GP":{
                title:"Formula 1 Academy: Reverse Grid Race at the Dutch GP",
                subtitle:"Westcott achieves her maiden Formula 1 Academy victory in a dramatic Reverse Grid Race at Zandvoort."
                ,image:"assets/images/F1 Academy/Dutch Gp Reverse.jpg",
                authorName:"Arelimar Colon Rodriguez",
                authorPic:"assets/images/authors/arelimar-rodriguez.jpeg",
                content:`Saturday afternoon in the Netherlands brought a reshaped grid for F1 Academy’s Reverse Grid Race, as Zoe Florescu was disqualified post-qualifying for a technical infringement after using the wrong engine oil, promoting Payton Westcott to pole. Megan Bruce was alongside her on the front row. Rachel Robertson, Nina Gademan, Emma Felbermayr and Natalia Granada filled out the rest of the top six, with Alba Larsen and Alisha Palmowski completing the reversed order.

The formation lap brought its own drama before the race even started, with Felbermayr’s team scrambling to get her engine covers secured and Bruce hopping out of the car on the grid. When the lights finally went out, Westcott made the most of her pole, building a gap immediately. Further back, Palmowski stalled not once but twice, triggering a yellow flag and dropping the championship leader to the back of the field before the race had properly begun. Paatz also stalled at the beginning and dropped to 17th.

Gademan wasted no time working her way forward, slotting inside Robertson early before setting her sights on Bruce. Her first attempt came up short, but she completed the move on lap 2.

Moments later, the race changed once again as Granada, caught between Turns 2 and 3 while trying to rejoin ahead of Felbermayr, hit the brakes while still facing the wrong direction and speared into the barrier, ending her afternoon and bringing out the safety car.

The stoppage handed Palmowski a chance to close back up to the pack before the safety car pulled in at the end of lap 1. Westcott immediately came back under pressure at the restart but held firm, while behind her, Felbermayr and Larsen found a way past Bruce.

Bruce is left defending against Lloyd, leading her to hold a tighter line, costing her and everyone behind time. Meanwhile, Florescu continued a quiet recovery drive, climbing to 13th.

The battle for the podium positions intensified from lap 5 onward. Felbermayr had a look at Robertson for third before Larsen tried the inside line on Felbermayr for fourth. Larsen completed that move a lap later, then continued forward, using a late brake into Turn 1 to take third outright. Further back, Palmowski continued her recovery, moving up to 16th past Paatz.

Contact arrived on lap 9 when Robertson ran wide into the gravel while Felbermayr pulled alongside, the pair making contact as Felbermayr understeered into her. This incident would have consequences later after some investigations. Around the same time, Jade Jacquet stopped on track, triggering a second safety car.

The restart came on lap 11, and this time it was once again Westcott who nailed it, extending her advantage at the front. Gademan wasn’t as fortunate, with Larsen sweeping around the outside and completing the pass despite locking up under braking. This move briefly drew question over whether she had gone ahead while side-by-side before the start line, though a replay found she was not.

Felbermayr kept fighting, going to the inside on lap 12, before a three-wide moment into Turn 1 shuffled the order further back. Ella Lloyd joined the fight too, going side-by-side with Felbermayr and coming out ahead to move into sixth, then setting her sights on Robertson.

On lap 16, Palmoswki, who was still running 13th, reported a problem with her car over team radio. She stated she wanted to finish the race but wanted to make her team aware of the issue prior to the Feature Race tomorrow, where she has pole.

Felbermayr’s earlier clash with Robertson caught up with her in the form of a five-second penalty, dropping her out of the points despite crossing the line in eighth. On the final lap, Lloyd completed her recovery drive by getting past Robertson, who was too occupied trying to get around Esmee Kosterman to defend.

At the front, Westcott crossed the line for a maiden F1 Academy victory, adding the race’s fastest lap, a 1:38.794, for good measure. Larsen’s late charge secured her first podium finish of the season, starting seventh, while Gademan completed the podium in front of her home crowd, a week ahead of her birthday. Kosterman, who finished fourth, scored her first points of 2026 at her home race. Lloyd, Robertson, Bruce, and Dobson rounded out the points in a race that marked F1 Academy’s final visit to Zandvoort for the foreseeable future after the Feature Race tomorrow.

Palmowski and Felbermayr both left the race without points, keeping their championship gap at 30 with the Feature Race still to come, while Gademan’s podium closes her to within 22 points of Felbermayr for second.
`},

"Lights-On-Fernando-Alonso":{
                title:"Lights On: Fernando Alonso",
                subtitle:"A look back at the career of one of Formula One's most talented and enduring drivers, Fernando Alonso."
                ,image:"assets/images/F1/Alonso.png",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`He has entered 438 grand prix and scored 2,394 career points. With 32 race wins, 106 podiums, and two world championships, he is one of Formula One’s greatest drivers. This is the story of Fernando Alonso.

Alonso was born in Oviedo, Spain in 1981. He started go-karting at three years old and won his first kart race when he was seven. As a teenager, he progressed to the Euro Open by Nissan and the International Formula 3000 Championship. 

Alonso got his first taste of an F1 car in 2001 with Minardi. In 2003, he signed with Renault, a move that would change the trajectory of his career. He became the youngest driver to be on pole position and the youngest race winner.

In 2005, he was crowned the World Champion with Renault, beating Kimi Räikkönen at Ferrari. Alonso was the youngest world champion at the time. He won again the following year, making him a two-time champion at only 25 years old. 

He switched teams for 2007, partnering rookie Lewis Hamilton at McLaren. The teammates fought closely all season and ultimately tied on points. Despite strong results, McLaren was disqualified from the constructors' championship due to a conspiracy known as Spygate. This involved the communication of confidential information between McLaren and Ferrari. 

After another stint with Renault, Alonso signed a contract with Ferrari starting in 2010. This was at the start of Sebastian Vettel’s dominance with Red Bull Racing, and the two drivers frequently battled. Despite remaining with Ferrari for five years, Alonso’s best finish was runner-up in the championship in 2010, 2012, and 2013.

He returned to McLaren in 2015, but an unreliable car caused him to struggle. He was beaten by his teammate, Jenson Button, in their first year together. After a challenging few years, Alonso decided that it was time to step away from F1 at the end of the 2018 season.

His retirement was short-lived, as he signed a contract three years later to join Alpine for the 2021 season. At the Hungarian Grand Prix that year, Alonso, after briefly leading the race, held off Hamilton; this allowed his Alpine teammate, Esteban Ocon, to win the race. Later that season, Alonso finished on the podium at the Qatar Grand Prix.

After a dramatic exit from Alpine, Alonso signed a multi-year contract with Aston Martin to partner Lance Stroll. Alonso finished on the podium on his 2023 debut for the team, and ended up scoring eight podiums that season. He finished fourth in the standings, his highest championship finish in a decade.

Since 2024, the Aston Martin team has struggled for pace. Other than being the first driver in F1 history to start 400 grand prix, Alonso’s last three years have been relatively lackluster. This season has been Aston Martin’s worst yet, with both cars frequently failing to make it out of Q1. They have scored one point, courtesy to Alonso’s tenth-place finish at the 2026 Monaco Grand Prix. 

Fernando Alonso’s current contract only lasts through the end of this season. With silly season in full swing, it is unclear as to whether the 45-year-old will continue to race with Aston Martin, sign with a new team, or announce his retirement for the second time.
`},

"Let's-Torque-History-Senna-vs-Prost":{
                title:"Let's Torque History: Senna vs Prost",
                subtitle:"Explore the legendary F1 rivalry of Ayrton Senna and Alain Prost, from fierce championship battles at Suzuka to their powerful final friendship."
                ,image:"assets/images/history/senna and prost.jpg",
                authorName:"Tori Turner",
                authorPic:"assets/images/authors/tori-turner.jpeg",
                content:`Hamilton and Verstappen. Häkkinen and Schumacher. Hunt and Lauda. These are just a handful of names that come to mind when you think of racing rivalries, forged in racing history for their own individual reasons. But one pairing outshines them all, constantly ranked as the greatest rivalry in Formula One, their feud covered by countless books, documentaries and even a Netflix series. It can only be <i>Ayrton Senna and Alain Prost.</i>

Whilst the seeds of their rivalry had been sown years earlier through stolen seats and denied victories, their conflict truly began in 1988, when Senna joined Prost at McLaren. The two raced against each other with minimal issues that year, with Senna beating Prost to the championship on his first attempt. Despite the season appearing calm and uncontroversial on paper, rumours swirled of favouritism from Honda towards the Brazilian, setting the scene for the 1989 season where everything intensified.

It was never in doubt that a McLaren driver would win the 1989 title; it was just a matter of which one. The decisive moment came at the Japanese Grand Prix at Suzuka in a move which is still contested to this day. With seven laps to go, Senna attempted to pass Prost with a dangerous lunge down the inside of the Casio Triangle, whilst Prost angled his car towards his rival. The two drivers dramatically banged wheels, stopping at the escape road with Prost retiring from the race and Senna miraculously continuing. He went on to win the race, before later being disqualified for cutting the chicane as he rejoined the track, handing the title over to the Frenchman.

In the aftermath, Prost left McLaren for Ferrari, no longer able to deal with the favouritism from Honda, which had escalated throughout the 1989 season, and his own tensions with McLaren. No longer teammates, their rivalry reached new heights. The two battled back and forth throughout the championship, stealing wins off each other amidst mechanical failures and other car issues. 

The season came to a close at Suzuka once again, though it was Senna who held the upper hand this time around. The inevitable happened – they clashed. There was nothing to be contested this time around, it was clear that Senna had purposefully turned into Prost on the opening lap of the race, having previously stated he would do so. Despite the evidence pointing towards him as the instigator, he escaped persecution and was handed the championship. 

After two successive controversies, their rivalry cooled off, with the two no longer directly competing on-track. Ferrari fell out of contention in 1991, whilst McLaren fought against Williams en route to another Senna victory. The lack of results from the Italian team resulted in Prost taking a sabbatical for the 1992 season, before he returned in 1993 to race for Williams. Prost stormed to the title with the British team, finishing 27 points ahead of Senna in second place.

The chapter of their rivalry closed for good when Prost retired for good at the end of the 1993 season. Senna replaced him at Williams in a bid to chase his next title with the sport’s current top team. The two spent their final podium together at the 1993 Australian Grand Prix in Adelaide, where Senna invited Prost up onto the top step of the podium with him in a warm embrace. 
This move allowed the two to finally put their long history behind them and mark the beginning of a friendship that had once seemed impossible. Six months later, their chance of companionship was cut short when tragedy struck in a moment where the entire sport – and the country of Brazil – stood still. 

In a weekend marred by disaster, Senna lost his life at the 1994 San Marino Grand Prix, less than 24 hours after Roland Ratzenberger was killed in qualifying. The two had talked that morning over breakfast in one final conversation, having found common ground on driver safety and racing since Prost’s retirement. At Senna’s funeral, Prost acted as a pallbearer, carrying his coffin alongside several other racing drivers in a final goodbye to his rival.

If you look back at any great rivalry in this sport, you will find that many are short-lived, never lasting any longer than the span of their careers. Their feuds are forgotten, often viewed as trivial and insignificant years later, whilst fans remember them as fierce and historic. With Senna’s career cut short in horrific circumstances, it is left to the imagination how his friendship with Prost may have developed over the years, with their rivalry now part of his legacy.
`}
            ,"Silly-Season-Roundup-Week-2":{
                title:"Silly Season Roundup: Week 2",
                subtitle:"A breakdown of the evolving 2027 silly season, exploring how Ferrari and Red Bull juniors could trigger a major driver shakeup across Cadillac, Williams, and Racing Bulls."
                ,image:"assets/images/F1/silly season 2.jpg",
                authorName:"Tori Turner",
                authorPic:"assets/images/authors/tori-turner.jpeg",
                content:`<b>The return of the German GP?</b>
Amidst the panic surrounding the fate of the final two races of the 2026 season and their inevitable replacements, rumours have circulated regarding the return of classic circuits and the addition of new tracks to future rosters. Thailand, Argentina, South Africa and Rwanda have all been mentioned on social media thus far, though the credibility of these reports have not been confirmed as of yet. In recent days, Stefano Domenicali, President and CEO of Formula 1, added fuel to the fire by confirming that discussions are underway to bring Germany back to hosting a Grand Prix.

The country has not hosted a race since the 2020 Eifel Grand Prix, held at the Nürburgring after a scramble to find suitable tracks in the middle of the COVID-19 pandemic. Before the one-off outing, Germany had been removed from the calendar at the end of the 2019 season, bidding farewell to the Hockenheimring after a chaotic race in the wet. Since its departure, many fans of the sport, including German enthusiasts, have begged to see a race at either of the two circuits once more, proving the strong demand for its return.

At the start of the season, Audi entered the championship as a constructor, joining powerhouse Mercedes as the second German team in the series. Nico Hülkenberg is also the sole German driver in the sport, though it may be some time until a fellow countryman joins him in the pinnacle of motorsport. With the addition of sponsors and fans, there is more than enough interest to justify adding Germany back onto the calendar.

Speaking on the timeframe of Germany returning to its rightful place on the calendar,  Domenicali said: "I think now Germany wants us to think in the medium term if they can come back into the calendar or, even more important, being, as it was 20 years ago, one of the most important markets for Formula 1.”

With the potential of a return now seeming certain, it poses the question of which track will have the honour of hosting the German Grand Prix again.

<b>Cadillac’s choices</b>

It wouldn’t be silly season without the rumours of where Formula 2 graduates may end up – if there are even any spots on the grid left to give rookie drivers a chance! Two names have been brought up several times already through their existing links to teams via their driver academies: Rafael Câmara and Nikola Tsolov. 

Whilst Câmara has previously been linked to Haas, which has previously housed Ferrari juniors at the start of their careers, it’s now appearing that the Brazilian may find his place at Cadillac instead. However, it seems like Ferrari will be decisive in where he ends up for the 2027 season and may have the final say over his contract, as it will be on conditions of a loan. Tsolov’s name has also been mentioned, though it seems likely that he will join Red Bull’s sister team, Racing Bull, if he makes the move up to Formula 1.

With the possibility of Cadillac searching for fresh blood, their current driver, Sergio Pérez, has begun his own search for a seat in 2027. Despite returning to the sport this year after his departure from Red Bull in 2024, his time may already be up with his new venture. It has been reported that his management is currently discussing options for a switch to Williams, though this is all dependent on whether Carlos Sainz decides to leave the British team at the end of the season.

Multiple reports have suggested that the Spaniard is growing more frustrated with James Vowles and the team after poor results and a disappointing start to the new regulations. If he were to leave, a move to Audi may be on the cards, though there are still plenty of open seats at almost every team on the grid. 

Amongst talk of who could potentially be heading to the American team next year, the complete opposite has also been in the news. Colton Herta, former IndyCar race winner and current Formula 2 driver, has underperformed in his campaign to gain the crucial super license points needed to race in Formula 1 with Cadillac. It seems as if his hopes have faded and he may not become the next American to race in the series, with Formula 3’s Ugo Ugochukwu likely to take up that mantle in a few years time if the reports of Cadilac’s interest are true.
                `}
            ,"Paddock-Pets":{
                title:"Paddock Fashion: Paddock Pets",
                subtitle:"We introduce our favourite paddock pets and the stories behind their appearances."
                ,image:"assets/images/pets/cover.jpg",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`Even with their extensive travelling and limited free time, many Formula 1 drivers still find time to add furry friends to their families. Keep reading to learn about the pets of the paddock, from dogs and cats to horses!

<b>Lewis Hamilton</b>

While yet to be confirmed by Lewis Hamilton himself, the seven-time world champion seems to have recently adopted a golden retriever named Halo. This comes after Roscoe, his English bulldog, passed away in September 2025 after being diagnosed with pneumonia. Roscoe was a beloved member of the paddock for 12 years, frequently making appearances at the British Grand Prix and other races. Hamilton created an Instagram for his bulldog called @roscoelovescoco; this account has 1.3 million followers.

<img src="assets/images/pets/ROSCOE PICTURE.jpg" alt="Roscoe, Lewis Hamilton's English bulldog" width=100% style="display: block; margin-left: auto; margin-right: auto;">

<b>Charles Leclerc</b>

In April 2024, Charles Leclerc and his now-wife Alexandra Leclerc adopted Leo, a miniature dachshund. Leo has become a fixture of the paddock, as well as often appearing on both Charles and Alexandra’s respective Instagram pages. He was even seen in one of the official photos for the Leclercs’ wedding. Leo has created some viral moments online; most recently, he had an accident in front of the Red Bull Racing garage during the 2026 Hungarian Grand Prix weekend. 

<img src="assets/images/pets/LEO PICTURE.jpg" alt="Leo, Charles Leclerc's miniature dachshund" width=100% style="display: block; margin-left: auto; margin-right: auto;">

A fan-favorite moment happened at the 2024 British Grand Prix when Roscoe met Leo for the first time. This came after the announcement that Hamilton would be joining Leclerc and Ferrari for the 2025 season, and the two dogs appeared to become fast friends.

<img src="assets/images/pets/LEO ROSCOE PICTURE.jpg" alt="Leo and Roscoe together" width=100% style="display: block; margin-left: auto; margin-right: auto;">

<b>Max Verstappen</b>

The Red Bull Racing driver has four pets in total: three cats and one dog. Max Verstappen’s first two cats, Jimmy and Sassy, have frequently appeared on his sim racing livestreams. One of them was once stuck in a cupboard, forcing Verstappen to break down the door with a hammer. Donatello, nicknamed Donut, is the most recent cat; he also has Nino, a dachshund. 

<img src="assets/images/pets/MAX CAT PICTURE.jpg" alt="Max Verstappen's cats" width=100% style="display: block; margin-left: auto; margin-right: auto;">

<b>Alex Albon</b>

Albon and his family own so many pets that they refer to it as the “Albon Zoo.” Not all pets belong to the Williams driver specifically, as some belong to his siblings. Albon himself has struggled to remember all of his pets, as the family seems to add new members fairly frequently. The official list on Albon’s website states that there are 16 cats, two horses, and one dog. Their Instagram account, @albon_pets, has 412,000 followers. Albon dedicated a helmet to them at the 2022 British Grand Prix and has designed merchandise featuring different members of the Albon Zoo.

<img src="assets/images/pets/ALEX HELMET PICTURE.jpg" alt="Alex Albon's helmet" width=100% style="display: block; margin-left: auto; margin-right: auto;">

<b>Pierre Gasly</b>

With an Instagram post in July 2024, Pierre Gasly and partner Kika Gomes introduced the world to Simba, a toy poodle. He often makes appearances at races and has been spotted in the Alpine hospitality area. In an interview for F1.com, Gasly mentioned that he had to switch the flooring in his house from carpet to hardwood because the puppy loved running and sliding on the smoother surface. Although Simba is one of the newer dogs in the paddock, he has merchandise through Gasly’s official store and dedicated fan pages. 

<img src="assets/images/pets/SIMBA PICTURE.jpg" alt="Simba, Pierre Gasly's toy poodle" width=100% style="display: block; margin-left: auto; margin-right: auto;">

<b>Nico Hulkenberg</b>

Nico Hulkenberg and his family have one dog, a black and white Pomeranian named Zeus. Even though he is often featured on the driver’s Instagram, Zeus has his own page, @zeus_hulkenberg, with 33,000 followers. He made his most recent paddock appearance at the 2026 Hungarian Grand Prix and has previously been photographed throughout Hulkenberg’s career at various teams’ garages. 

<img src="assets/images/pets/ZEUS PICTURE.jpg" alt="Zeus, Nico Hulkenberg's Pomeranian" width=100% style="display: block; margin-left: auto; margin-right: auto;">

From becoming Instagram celebrities and going viral on social media to being spotted in the paddock, these pets have become almost as well known as their famous humans. 
`},
            "Marketing-in-Formula-1":{
                title:"Let's Torque history: The Importance of Marketing in Formula 1",
                subtitle:"We dive into how teams like Racing Bulls and Aston Martin navigate paddock exposure in the digital age."
                ,image:"assets/images/history/ricciardo.avif",
                authorName:"Joseph Worrell",
                authorPic:"assets/images/authors/joseph-worrell.jpeg",
                content:`In the modern era of Formula One, it isn’t just the mechanical engineering or the latest set of engine regulations that takes centre stage, it is now also about how teams build a brand and become a marketable asset off the track too. It is important to acknowledge how teams and drivers boost PR, create a positive image through social media and how this can help grow fanbases as well as keep sponsors satisfied. 

We all know how important social media is in today's world and in the world of F1, it is no different. Social media platforms such as TikTok, Instagram, and X are how supporters can engage with their favorite team or driver through promotional content that the teams put out. Some of the content published will be a team's drivers playing a fun game or engaging in a sponsor led Q&A session, whilst other teams prefer to make shorter form content opting for a more humorous and quicker interaction from the drivers. The team who are leading this new generation of online fan engagement are Racing Bulls, formally known as V-CARB. 

Racing Bulls have been the so-called ‘sister team’ to Red Bull Racing since 2005 when Red Bull came into the sport buying both Jaguar and Minardi respectively. This led to Racing Bulls lacking a true identity as they were always known as the ‘B team’ to Red Bull and would only serve to promote drivers to Red Bull racing. Over the past two or three seasons, however, Racing Bulls have adopted a very simple but very clever approach to try and rebrand themselves but to also separate them from the tag of being Red Bulls sister team. 

With social media becoming ever bigger and more of a marketing tool, Racing Bulls invested in their social media and PR team, bringing their fans funny and watchable TikTok videos where the fans get to see a different side of the drivers that they usually don’t get to see. The TikTok videos usually involve the social media admin catching both drivers entering the paddock on each day of the F1 weekend and asking them funny, different and unrelated questions to racing. These questions or trends that the social media team directs at their drivers provokes a natural and personable reaction which looks great for a short form video and shows the drivers in a good light. As well as a positive impact for the drivers, it also reflects well on the team who are then portrayed as a group who have togetherness and harmony within their garage and motorhome. But, crucially, this keeps sponsors happy because they too now get positive exposure and are under that label of funny, personable and harmonic. Happy sponsors, happy team. 

A team that takes the opposite approach is Aston Martin. They are known to be a classy, stylish and corporate brand who are the leading car manufacturer in the automotive industry in the UK. This translates over to the F1 team as well who don’t often make humorous short form content and rarely jump on social media trends. Another reason for this is that their drivers aren’t marketable. Fernando Alonso has just turned 45, making him the oldest on the grid; this also makes him less relatable to a younger audience who like to support and idolise a driver that they feel they can relate to. When you also take into account the fact that Aston Martin currently has the slowest car on the grid, 3 seconds slower than the next best car, this creates a huge deficit when it comes to online exposure and positive marketability. 

Lastly, a driver who was a team, sponsors, and marketing dream is Daniel Ricciardo. Ricciardo was a fan-favourite and had been given the tag for being the funniest driver on the grid during his time at Red Bull. He would always interact with fans, regularly use his Aussie charm in front of the camera and had the best PR out of any driver he was racing against. This made him an asset to Red Bull at the time who viewed him not just as a driver, but a marketing tool as well. Ricciardo would often steal the front pages of magazines and bulletins with his smile, allowing positive exposure for him, Red Bull and F1 as a business. When he left the sport midway through 2024 after being released by Racing Bulls to make way for Liam Lawson, he was a great loss for a sport that enjoyed the exposure from his positive and down to earth attitude.
            `},   
            "The-Lotus-88":{
                title:"Let's Torque history: The Twin-Chassis Gamble and the Lotus 88",
                subtitle:"Exploring the legacy of one of Formula 1's most unique and innovative cars."
                ,image:"assets/images/history/lotus 88.jpg",
                authorName:"Eya Amri",
                authorPic:"assets/images/authors/eya-amri.jpg",
                content:`In Formula 1 history, few names evoke as much awe, or legal headache, as Colin Chapman. The legendary Lotus founder built an empire on a singular, relentless mantra: “Simplify, then add lightness.” But in 1981, as regulatory changes threatened to derail Lotus's crown jewel, ground effect, Chapman delivered a machine that was anything but simple.

Enter the Lotus 88: a car so radical, so technically daring, and so terrifyingly clever that rival teams banded together to ban it before it could even race a single lap.

<b>The Price of Ground Effect</b>

To understand the Lotus 88, we have to rewind to the late 1970s. Lotus had revolutionized the sport by introducing ground-effect aerodynamics with the Lotus 78 and 79. By using inverted wing profiles underneath the sidepods and sealing the underside with sliding skirts along the asphalt, cars were effectively sucked to the ground, pulling astonishing cornering speeds.

However, the sheer downforce came at a cost. To keep the underbody seal consistent, teams ran their suspension systems almost rock-solid. The ride was brutal. Drivers suffered relentless physical punishment as ground-effect cars violently slammed against track surfaces, with little to no suspension play to absorb the impact.

Fearing skyrocketing speeds and driver safety risks, the FIA stepped in for the 1981 season, banning sliding skirts and mandating a minimum ground clearance of 60mm.

While other constructors spent their winter months building hydro-pneumatic lowering systems to bypass the 60mm rule on-track, Chapman took a far more audacious approach. He exploited a semantic loophole in the rulebook. The technical regulations explicitly dictated rules regarding a chassis. They said nothing about building two.

<b>One Car, Two Souls</b>

The core philosophy behind the Lotus 88 was brilliantly simple in theory, yet extraordinarily complex in execution: separate the aerodynamic loads from the mechanical loads acting on the driver.

Chapman, alongside engineers Peter Wright, Tony Rudd, and Martin Ogilvie, designed a machine featuring two nested bodies: first, the primary (outer) chassis: Constructed from carbon fiber and Kevlar, this lightweight structure contained the external bodywork, sidepods, and wings. It was mounted directly onto the wheel uprights via stiff springs. As the car built up speed, aerodynamic downforce would push the outer chassis down, creating a tight seal with the track surface without compressing the engine or driver safety cell. Secondly, the secondary (inner) chassis: Nestled comfortably inside the outer shell sat a soft-sprung carbon-composite monocoque holding the driver, fuel tank, Cosworth DFV engine, and gearbox.

When standing still in the pit lane, the car complied with all ride-height regulations. But out on the circuit, the outer body took the heavy aerodynamic beating, allowing the inner body, and the driver, to float smoothly over bumps with traditional, soft suspension. It offered maximum downforce for the car and maximum compliance for the driver.

<b>Black Flags and Paddock Politics</b>

When Team Lotus unveiled the Lotus 88 at the opening round of the 1981 season in Long Beach, the paddock erupted.

Rival constructors, terrified that Chapman had once again unlocked a dominant design advantage, immediately lodged formal protests. They argued that the entire outer chassis acted as a "movable aerodynamic device," which was strictly outlawed under FIA regulations.

What followed was one of the most turbulent bureaucratic sagas in F1 history: Scrutineers initially passed the car, but overwhelming pressure from rival teams forced stewards to black-flag the 88 during practice sessions. Driver Elio de Angelis was relegated to racing the older Lotus 81.

As a consequence, Lotus brought the 88 to Brazil and Argentina. Each time, it passed initial technical inspection, only to be disqualified or banned following furious protests from rival teams. Enraged by FISA president Jean-Marie Balestre and the governing body's handling of the rules, Chapman boycotted the San Marino Grand Prix at Imola, marking the first time since 1958 that a Team Lotus entry was missing from a Formula 1 grid.

Despite a modified version (the 88B) being presented at Silverstone later that summer, the decision was final: the twin-chassis concept was banned permanently.

<b>A Masterpiece Unheard</b>

Because the Lotus 88 was never allowed to start an official race, its true pace remains one of Formula 1's ultimate unanswered questions. Initial feedback from drivers Elio de Angelis and Nigel Mansell suggested the car was complex and tricky to dial in, but its potential was undeniable.

Beyond its controversial twin-chassis configuration, the Lotus 88 held another monumental place in motorsport engineering: alongside the McLaren MP4/1, it was one of the very first Formula 1 cars to pioneer a full carbon-fiber monocoque chassis, fundamentally altering racecar safety and structural rigidity forever.

The Lotus 88 stands as a monument to Colin Chapman's unmatched ability to read between the lines of a rulebook. It wasn't just a race car; it was a bold statement that when engineering genius meets regulatory constraints, innovation will always push the boundaries of what is possible.
            `},
            "Silly-Season-Roundup-Week-1":{
                title:"Silly Season Roundup: Week 1",
                subtitle:"From Max Verstappen's high-stakes Red Bull exit clause to an unexpected off-track legal battle surrounding championship leader Kimi Antonelli, we’re breaking down all the contract chaos."
                ,image:"assets/images/F1/max kimi.jpg",
                authorName:"Tori Turner",
                authorPic:"assets/images/authors/tori-turner.jpeg",
                content:`<b>Time's up!</b>
Driver transfer rumours are expected to heat up with no on-track action to satisfy fans during the summer shutdown period. Whilst names such as Max Verstappen and George Russell have dominated ‘Silly Season’ thus far, it’s important to remember that both drivers have valid contracts that go beyond the end of the season, locking them in for 2027 unless exit clauses or terminations happen. 

It’s easy to forget that half of the grid have not yet signed known contracts for 2027, whether they’re renewing their contract with their current team, looking to change to a new competitor, or switching series entirely. This also extends to drivers on vague multi-year contracts with no clear end date. The names at risk include Isack Hadjar, Fernando Alonso, Esteban Ocon, Ollie Bearman, Carlos Sainz, Nico Hulkenberg, Liam Lawson, Arvid Lindblad and Franco Colapinto.

Whilst there has been no official statement from the team yet, Gabriel Bortoleto’s fans can be assured that the Brazilian will remain with Audi for 2027 after he announced he will remain with them for ‘many years’ ahead of the Hungarian Grand Prix. Similarly, Lance Stroll’s contract length has never been made public, though it is almost certainly guaranteed that he will remain with Aston Martin for the foreseeable future.

<b>No exit clause for Verstappen</b> 
Still, further details have emerged regarding Verstappen’s ongoing contract dispute with Red Bull. The team are eager to keep their four-time world champion in their grasp, but will promising upgrades be enough to sway the Dutchman to stay?

Verstappen’s current contract has been subject to much attention over the past two seasons because it includes an exit clause that allows him to depart the team if he’s not in the two two of the drivers’ standings by the summer break. As of the Hungarian Grand Prix, the final race before the four-week break, Verstappen is sixth in the championship, with him now able to activate the clause until October.

Whilst he deliberates his options, Red Bull have reportedly offered him a contract extension to stay with the team beyond 2028. Should he accept their offer, he would gain a salary increase, but would lose the exit clause that is allowing him to consider a change for 2027. With links to rival teams and new challenges in separate series, Verstappen has much to think about over the upcoming months.

<b>Antonelli vs Minardi</b>
If there’s one driver that has defined the 2026 season so far, it has to be Kimi Antonelli. The championship leader has controlled races and news stories throughout the first 11 races, but the Hungarian Grand Prix saw his name enter the headlines for an unexpected reason: an ongoing lawsuit. 

In a dramatic turn of events, Antonelli’s former manager, Giovanni Mardi, filed a civil lawsuit seeking millions in compensation for his role in Antonelli’s junior career and the early termination of his managerial role. The Italian was represented by Minardi Management, run by the son of former F1 team owner Gian Carlo Minardi, for four years between 2014 and 2018. 

After leaving Minardi’s supervision, he joined the Mercedes Junior Team and remained with them throughout his karting and junior single-seater career, before making the step up to their F1 team in 2025. Minardi believes he should be recognised for his effort and work in Antonelli’s career, with the 19-year-old currently leading the championship standings by 50 points.

Early reports suggest that both sides are far from settling, pointing towards a lengthy process for Antonelli should the Bologna court proceed with Minardi’s claim.
`}
            ,"Replacements-for-Qatar-and-Abu-Dhabi":{
                title:"Replacements for Qatar and Abu Dhabi",
                subtitle:"With Middle East race cancellations looming, Imola and Portimão emerge as potential F1 season finales."
                ,image:"assets/images/F1/qatar.avif",
                authorName:"Joseph Worrell",
                authorPic:"assets/images/authors/joseph-worrell.jpeg",
                content:`As F1 reaches the summer break to mark the halfway stage in the 2026 season, there is still widespread uncertainty over where the season will end. Due to the ongoing conflict in the Middle East, and potentially up to four races being disrupted; The Bahrain and Saudi Arabian Grand Prix’s were both originally meant to take place in April but were postponed with the intent to be reinstated later in the season. Bahrain has since been replaced by Sepang, but there seems to be no plans to reinstate or replace Saudi Arabia, meaning we will lose a race this year. The big talking point heading into the summer break, however, are the cancellations of the Qatar and Abu Dhabi Grands Prix which were due to be the final two races of the season and are set to take place at the end of November and start of December. 

                It is unclear whether Formula 1 plans to replace both races should they be unable to take place. Imola and Portimão are the two heavily rumoured circuits willing to hold the final race of the season, but with the season likely ending around the start of December, climate will play a pivotal role. 

                Because Portimão is in the Algarve region in the south of Portugal, the average temperature in December is a mild 17 °C, which is appropriate for Formula 1. Its high-speed, undulating, and sweeping corners allow for good racing, and F1 is set to return to the circuit next year anyway as it rejoins the calendar following its cameo appearances in 2020 and 2021 due to COVID-19. 

                Imola on the other hand, being in the north of Italy, sees a much lower average temperature in December of 10 degrees Celsius and a much higher rate of rainfall which can often lead to flooding. The circuit, however, is a fan favourite and is steeped in history with it being one of the most iconic circuits in the world. Furthermore, from a marketing perspective it would be much more powerful with it being Kimi Antonelli and Ferrari’s home race; this falls into significance when you consider that Kimi Antonelli could become the youngest world champion and Ferrari could win its first driver’s and constructor’s championship since 2007. 

                Another option that had been discussed was a double header in Las Vegas. This has since been shut down due to the impracticality and clashes with other US sporting events. F1 CEO Stefano Domenicali has said that a decision will be made no sooner than mid September, after the Spanish Grand Prix in Madrid which gives the impression that they are hopeful that Qatar and Abu Dhabi will still be able to round off the season as originally expected. Domenicali has also gone on to say that if either race cannot take place then F1 will finish the season in Europe, pointing towards Imola or Portimão getting the nod.
            `}
            ,"Youngest-record-breakers":{
                title:"Let’s Torque History: The Youngest Drivers to Break Records",
                subtitle:"Antonelli’s meteoric rise, his record-breaking maiden pole position, and how modern F1 is placing its bets on teenage talent."
                ,image:"assets/images/history/antonelli-records.jpg",
                authorName:"Bella Rosen",
                authorPic:"assets/images/authors/bella-rosen.jpeg",
                content:`Putting a teenager into one of the most coveted seats in Formula One sounds like a recipe for disaster, especially one who skipped part of the junior ranks and finished only 6th in Formula 2. However, at only nineteen years old, Kimi Antonelli is the youngest driver to ever lead the F1 World Championship. 

Born in Bologna, Italy, Antonelli was signed to the Mercedes Junior Team in 2019 when he was just twelve years old. After progressing through junior series and continuing to impress Mercedes, he had his first taste of Formula One at a practice session during the 2024 Italian Grand Prix weekend. He spun about 10 minutes into the session after he set the fastest lap time.

When Lewis Hamilton announced he was moving from Mercedes to Ferrari for 2025 and beyond, speculation that Antonelli would be his replacement increased. The decision was controversial, with some saying that Antonelli should spend another year in F2 to gain more experience. Others said he should be placed at Williams for a few years, as that strategy worked with George Russell. However, Mercedes felt that the young driver was prepared.

In his first race, Antonelli finished highest of any of the 2025 rookie drivers. At 18 years and 202 days old, he became the third-youngest points-scoring driver in F1 history. He continued to impress throughout his debut season, finishing in 7th place with 150 points. 

Currently, he is leading the championship and is 50 points ahead of Hamilton in second. Antonelli is also beating Russell, his Mercedes teammate, by 59 points.

Antonelli has won six races this season, making him the second-youngest F1 winner ever. He has also finished on the podium in all but two races. It was unexpected for him to be beating his teammate, considering Russell has six more years of F1 experience and is nine years older than Antonelli.

Being less experienced does not automatically correlate with having worse results. Teams have started taking chances on talented drivers who are still teenagers or in their early twenties. In modern F1 history, the age when drivers become successful has become younger and younger, especially since the turn of the century.

<b>Lance Stroll</b>

At the 2017 Azerbaijan Grand Prix, Lance Stroll became the youngest rookie to achieve a podium. Stroll came in third place, only 0.105 seconds away from second; Daniel Ricciardo won, with Valtteri Bottas behind him. Stroll was only 18 years and 239 days old when he broke this record, and it has not been broken again since. However, Antonelli came close in 2025, getting a podium in his rookie year when he was about two months older than Stroll was. Even though Antonelli was unable to break the record, it shows how quickly he was able to show his ability while racing in the pinnacle of motorsport. Overall, he is the third-youngest podium sitter; Max Verstappen is the youngest, but achieved this in his second year of F1. 

<b>Max Verstappen</b>
