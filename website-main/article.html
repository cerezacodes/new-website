<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,300;0,400;0,700&display=swap" rel="stylesheet">    <title>Article Viewer</title>
<link rel="icon" type="image/png" href="assets/images/insta logo.png">
    <style>
        body {
            background-color: #f1efe5; /* Matches your site's bright blue background */
            color: black;
            font-family: "Libre Baskerville", serif;
            margin: 0;
            padding-right: 20px;
            padding-left: 20px;
        }
    
        .container {
            max-width: 50%;
            margin: auto;
            padding: 20px;
            align-items: center;
        }

        .back-link {
            color: #FF007F;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.25rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #article-title {
            font-size: 2.25rem;
            margin-bottom: 10px;
            color: #0078FF;
            font-family: "Playfair Display", serif !important;
        }

        #article-subtitle {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 20px;
            opacity: 0.9;
            font-family: "Playfair Display", serif !important;
        }

        #article-image {
    width: 80%;
    max-height: 1000px;
    object-fit: cover;
    border-radius: 16px;
    display: block;          /* Turns it into a block element */
    margin: 0 auto 30px auto; /* Centers it left/right, keeps your 30px bottom margin */
}

        #article-figure {
            margin: 0 auto 30px;
            width: 80%;
        }

        #article-figure #article-image {
            width: 100%;
            margin: 0;
        }

        #article-caption {
            display: none;
            margin-top: 8px;
            color: rgba(0, 0, 0, 0.52);
            font-family: "Poppins", sans-serif;
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
        }

        #article-content { 
            font-size: 1.25rem;
            line-height: 1.8;
            font-family: "Playfair Display", serif !important;
            white-space: pre-line; /* Keeps your paragraph line breaks intact */
        }

        #article-content * {
            font-family: "Playfair Display", serif !important;
        }

        #article-content p,
        #article-content li {
            font-size: inherit;
            line-height: inherit;
        }

        #article-content img {
            display: block;
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            object-fit: contain;
            margin: 20px 0;
        }
        @media (max-width: 768px) {
            body {
                padding-right: 10px;
                padding-left: 10px;
            }

  .container {
    width: 100% !important;
    max-width: 100% !important;
    padding: 1.5rem 1rem !important; 
    box-sizing: border-box !important;
  }

  .container img {
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
  }
            #article-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
            align-self: center;
        }
        #article-figure {
            width: 100%;
            margin-bottom: 10px;
        }
        #article-content { 
            font-size: 1.25rem;
            line-height: 1.8;
            white-space: pre-line;
        }
    }

  @media (max-width: 768px) {
    #authorPic {
      width: 90px !important;
      height: 90px !important;
      border-radius: 50% !important;
      object-fit: cover !important;
      margin: 10px !important;
      display: block !important;
    }
  }
    </style>
    
</head>
<body>

    <div class="container">
        <a href="articles.html" class="back-link">← Back to Articles</a>

        <h1 id="article-title">Loading...</h1>
        <p id="article-subtitle"></p>
        <figure id="article-figure">
            <img id="article-image" src="" alt="">
            <figcaption id="article-caption"></figcaption>
        </figure>
        <p id="article-content"></p>

        <!-- Dynamic Author Bio Section Elements -->
        <hr id="author-divider" class="author-separator">
        <div id="author-box" class="author-container">
            <div class="author-profile-pic">
                <img id="authorPic" src="" alt="">
            </div>
            <div class="author-info">
                <span class="written-by">Written by</span>
                <h3 id="authorName" class="author-name"></h3>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/runtime-config.js"></script>
    
<script>
        const articles = {};
        function normalizeRuntimeConfig(config = {}) {
            return {
                SUPABASE_URL: String(config.SUPABASE_URL || '').trim(),
                SUPABASE_ANON_KEY: String(config.SUPABASE_ANON_KEY || '').trim()
            };
        }

        function mapDbRowToArticle(row) {
            if (!row || !row.id) return null;
            return {
                title: row.title || 'Untitled Article',
                subtitle: row.subtitle || row.description || 'Freshly submitted article',
                image: row.image || 'assets/images/intro.png',
                imageCaption: row.image_caption || '',
                imageCredit: row.image_credit || '',
                authorName: row.author_name || 'Lights Out Team',
                authorPic: row.author_pic || 'assets/images/authors/eya-amri.jpg',
                content: row.content || '',
                font: "'Playfair Display', serif",
                category: row.category || 'news',
                publishedAt: row.published_at || new Date().toISOString()
            };
        }

        async function loadSubmittedEntries() {
  const runtimeConfig = normalizeRuntimeConfig(window.LIGHTSOUT_ENV);
  const supabaseUrl = (runtimeConfig.SUPABASE_URL || '').replace(/\/rest\/v1\/?$/, '');
  const supabaseAnonKey = runtimeConfig.SUPABASE_ANON_KEY || '';
  const supabaseClient = supabaseUrl && supabaseAnonKey && window.supabase
    ? window.supabase.createClient(supabaseUrl, supabaseAnonKey)
    : null;

  if (supabaseClient && articleId) {
    try {
      const { data, error } = await supabaseClient
        .from('articles')
        .select('*')
        .eq('id', articleId)
        .single();

      if (!error && data && new Date(data.published_at || 0).getTime() <= Date.now()) {
        const mapped = mapDbRowToArticle(data);
        if (mapped) {
          articles[data.id] = mapped;
        }
      }
    } catch (error) {
      console.warn('Supabase article detail fetch failed; using local fallback.', error);
    }
  }

            try {
                const parsed = JSON.parse(localStorage.getItem('lightsoutSubmittedArticles') || '[]');
                const localEntries = Array.isArray(parsed) ? parsed : [];
                localEntries.forEach((article) => {
                    if (!article || !article.id) return;
                    if (new Date(article.publishedAt || article.published_at || 0).getTime() > Date.now()) return;
                    articles[article.id] = {
                        title: article.title || 'Untitled Article',
                        subtitle: article.subtitle || article.description || 'Freshly submitted article',
                        image: article.image || 'assets/images/intro.png',
                        imageCaption: article.imageCaption || article.image_caption || '',
                        imageCredit: article.imageCredit || article.image_credit || '',
                        authorName: article.authorName || article.author_name || 'Lights Out Team',
                        authorPic: article.authorPic || article.author_pic || 'assets/images/authors/eya-amri.jpg',
                        content: article.content || '',
                        font: "'Playfair Display', serif",
                        category: article.category || 'news',
                        publishedAt: article.publishedAt || article.published_at || new Date().toISOString()
                    };
                });
            } catch (error) {
                console.warn('Local submitted article fallback failed.', error);
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function renderSelectedArticle() {
            await loadSubmittedEntries();

            if (articleId && articles[articleId]) {
                const currentArticle = articles[articleId];
                const articleTitle = document.getElementById('article-title');
                const articleSubtitle = document.getElementById('article-subtitle');
                const articleImage = document.getElementById('article-image');
                const articleContent = document.getElementById('article-content');
                const articleCaption = document.getElementById('article-caption');
                const authorNameEl = document.getElementById('authorName');
                const authorPicEl = document.getElementById('authorPic');
                const divider = document.getElementById('author-divider');
                const authorBox = document.getElementById('author-box');

                articleTitle.innerText = currentArticle.title;
                articleSubtitle.innerText = currentArticle.subtitle;
                articleImage.src = currentArticle.image;
                articleImage.alt = currentArticle.title;
                const captionParts = [currentArticle.imageCaption, currentArticle.imageCredit ? `Photo: ${currentArticle.imageCredit}` : ''].filter(Boolean);
                articleCaption.textContent = captionParts.join(' | ');
                articleCaption.style.display = captionParts.length ? 'block' : 'none';
                articleContent.innerHTML = currentArticle.content || '';

                if (currentArticle.authorName && currentArticle.authorPic) {
                    authorNameEl.innerText = currentArticle.authorName;
                    authorPicEl.src = currentArticle.authorPic;
                    authorPicEl.alt = currentArticle.authorName;
                    authorPicEl.style.width = '90px';
                    authorPicEl.style.height = '90px';
                    authorPicEl.style.borderRadius = '50%';
                    authorPicEl.style.objectFit = 'cover';
                    authorPicEl.style.margin = '10px';
                    if (divider) divider.style.display = 'block';
                    if (authorBox) authorBox.style.display = 'flex';
                } else {
                    if (divider) divider.style.display = 'none';
                    if (authorBox) authorBox.style.display = 'none';
                }

                const articleTextSize = Number(currentArticle.fontSize || currentArticle.font_size || 20);

                articleTitle.style.fontFamily = "'Playfair Display', serif";
                articleSubtitle.style.fontFamily = "'Playfair Display', serif";
                articleContent.style.fontFamily = "'Playfair Display', serif";
                articleTitle.style.fontSize = '2.25rem';
                articleSubtitle.style.fontSize = '1.2rem';
                articleContent.style.fontSize = `${articleTextSize}px`;
                articleContent.style.lineHeight = '1.8';

                document.title = `${currentArticle.title} | Lights Out`;
            } else {
                document.getElementById('article-title').innerText = 'Article Not Found';
                document.getElementById('article-content').innerText = "Sorry, we couldn't find the article you were looking for.";
            }
        }

        renderSelectedArticle();
    </script>
