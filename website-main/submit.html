<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Article | Lights Out</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/runtime-config.js"></script>
  <style>
    body {
      background: #090f1c;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
    }

    .submit-page-title {
      margin-bottom: 20px;
      color: #ffffff;
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .submit-form label,
    .submit-form .field-label,
    .submit-form .preview-header,
    .submit-form .preview-name,
    .submit-form .preview-section,
    .submit-form .form-status {
      color: #ffffff;
      font-family: 'Playfair Display', serif;
    }

    .submit-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .submit-form input,
    .submit-form select,
    .submit-form textarea,
    .submit-form button {
      font-family: 'Poppins', sans-serif;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-bottom: 0;
      border-radius: 4px 4px 0 0;
    }

    .editor-toolbar button {
      min-width: 38px;
      padding: 7px 10px;
      background: #ffffff;
      color: #090f1c;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
      font-weight: 700;
    }

    .editor-toolbar select {
      min-height: 34px;
      padding: 5px;
      color: #000000;
      border-radius: 3px;
    }

    .article-editor {
      min-height: 260px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 0 0 4px 4px;
      color: #000000;
      outline: none;
      font-family: "Libre Baskerville", serif;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    .article-editor:focus {
      border-color: #ffffff;
    }

    .article-editor img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      margin: 12px 0;
    }

    .article-editor h2 {
      font-size: 1.75rem;
      line-height: 1.35;
    }

    .article-editor h3 {
      font-size: 1.45rem;
      line-height: 1.4;
    }

    .article-editor blockquote {
      margin: 16px 0;
      padding-left: 16px;
      border-left: 4px solid #0078ff;
      font-style: italic;
    }

    .submit-form input,
    .submit-form select,
    .submit-form textarea {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #ffffff;
    }

    .submit-form select {
      color: #000000;
    }

    .editor-toolbar select {
      color: #ffffff;
      background: #1d2635;
    }

    .submit-form select option {
      color: #000000;
      background: #ffffff;
    }

    .category-picker {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 4px;
    }

    .category-picker:focus-within {
      border-color: #ffffff;
    }

    #categoryChips {
      display: contents;
    }

    .category-picker input {
      flex: 1 1 180px;
      min-width: 150px;
      padding: 7px 4px;
      background: transparent;
      border: 0;
      color: #ffffff;
      outline: none;
    }

    .category-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: #ffffff;
      color: #090f1c;
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .category-chip button {
      min-width: 18px;
      padding: 0;
      background: transparent;
      color: #090f1c;
      border: 0;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .submit-form input::placeholder,
    .submit-form textarea::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .submit-form .field-label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .submit-form .preview-box {
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.04);
      color: #ffffff;
    }

    .submit-form .preview-name {
      font-weight: 700;
      color: #ffffff;
    }

    .submit-form .preview-section {
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }

    .submit-form button {
      background: #ffffff;
      color: #090f1c;
      border: none;
      border-radius: 4px;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .article-editor {
        font-size: 1rem;
        line-height: 1.8;
      }

      .article-editor h2 {
        font-size: 1.45rem;
      }

      .article-editor h3 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <nav id="site-nav">
      <a href="index.html">Home</a>
      <a href="articles.html">Articles</a>
      <a href="submit.html">Submit Article</a>
    </nav>
  </header>

  <main style="max-width: 760px; margin: 40px auto; padding: 0 20px;">
    <h2 class="submit-page-title">Submit Your Article</h2>

    <form id="articleForm" class="submit-form">
      <div>
        <label for="authorName" class="field-label">Author Name *</label>
        <input type="text" id="authorName" required style="width: 100%; padding: 10px; box-sizing: border-box;">
      </div>

      <div>
        <label for="writerPassword" class="field-label">Writer Password *</label>
        <input type="password" id="writerPassword" required style="width: 100%; padding: 10px; box-sizing: border-box;" placeholder="Enter the writer password">
      </div>

      <div>
        <label for="title" class="field-label">Article Title *</label>
        <input type="text" id="title" required style="width: 100%; padding: 10px; box-sizing: border-box;">
      </div>

      <div>
        <label for="subtitle" class="field-label">Article Subtitle *</label>
        <input type="text" id="subtitle" required style="width: 100%; padding: 10px; box-sizing: border-box;" placeholder="Short summary shown under the headline">
      </div>

      <div>
        <label for="category" class="field-label">Category *</label>
        <div class="category-picker" id="categoryPicker">
          <div id="categoryChips" aria-live="polite"></div>
          <input id="category" type="text" list="categoryOptions" autocomplete="off" placeholder="Type a category and press Enter">
          <datalist id="categoryOptions">
            <option value="zandvoort">Zandvoort '26</option>
            <option value="hungary">Hungary '26</option>
            <option value="monaco">Monaco '26</option>
            <option value="barcelona">Barcelona '26</option>
            <option value="austria">Austria '26</option>
            <option value="UK">Britain '26</option>
            <option value="spa">Belgium '26</option>
            <option value="F2">Formula 2</option>
            <option value="F1A">Formula 1 Academy</option>
            <option value="LLO">Lady Lights Out</option>
            <option value="wheel">Let's Torque Wheel</option>
            <option value="history">Let's Torque History</option>
            <option value="lightson">Lights On</option>
            <option value="news">News</option>
            <option value="fashion">Paddock Fashion</option>
          </datalist>
        </div>
        <input type="hidden" id="categoryValues" name="category">
      </div>

      <div>
        <label for="coverImage" class="field-label">Article Picture *</label>
        <input type="file" id="coverImage" accept="image/*" required style="width: 100%; padding: 10px; box-sizing: border-box;">
        <div id="imagePreviewWrap" style="margin-top: 10px; display: none;">
          <img id="imagePreview" alt="Article preview" style="max-width: 220px; max-height: 220px; object-fit: cover; border-radius: 12px; border: 1px solid #ddd;">
        </div>
      </div>

      <div>
        <label for="seoTags" class="field-label">SEO Tags *</label>
        <input type="text" id="seoTags" required style="width: 100%; padding: 10px; box-sizing: border-box;" placeholder="Example: Formula 1, Ferrari, Zandvoort, race analysis">
      </div>

      <div>
        <label for="content" class="field-label">Article Content *</label>
        <div class="editor-toolbar" role="toolbar" aria-label="Article formatting tools">
          <select id="headingTool" aria-label="Text style">
            <option value="p">Paragraph</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
            <option value="blockquote">Quote</option>
          </select>
          <button type="button" data-command="bold" aria-label="Bold"><strong>B</strong></button>
          <button type="button" data-command="italic" aria-label="Italic"><em>I</em></button>
          <button type="button" id="inlineImageBtn" aria-label="Insert inline image">Image</button>
          <input type="file" id="inlineImageInput" accept="image/*" hidden>
        </div>
        <div id="content" class="article-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Article content" data-placeholder="Write your article here..."></div>
      </div>

      <div class="preview-box">
        <div class="preview-header" style="font-weight: bold; margin-bottom: 8px;">Author Preview</div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <img id="authorPreviewPic" src="assets/images/authors/Melinda-Gaese.jpeg" alt="Author preview" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; background: #fff;">
          <div>
            <div id="authorPreviewName" class="preview-name">Author Name</div>
            <div id="authorPreviewSection" class="preview-section">Lights Out Writer</div>
          </div>
        </div>
      </div>

      <button type="submit" id="submitBtn" style="padding: 12px; font-weight: bold; cursor: pointer; background-color: #ffffff; color: #090f1c; border: none; border-radius: 4px;">Submit Draft</button>

      <p id="formStatus" class="form-status" style="font-weight: bold; margin-top: 10px;"></p>
    </form>
  </main>
</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const AUTHOR_META = {
    'Melinda Gaese': {
      pic: 'assets/images/authors/Melinda-Gaese.jpeg',
      section: 'Lights Out Writer'
    },
    'Bella Rosen': {
      pic: 'assets/images/authors/bella-rosen.jpeg',
      section: 'Lights Out Writer'
    },
    'Joseph Worrell': {
      pic: 'assets/images/authors/joseph-worrell.jpeg',
      section: 'Lights Out Writer'
    },
    'Ellie Roddy': {
      pic: 'assets/images/authors/ellie-roddy.jpeg',
      section: 'Lights Out Writer'
    },
    'Tori Turner': {
      pic: 'assets/images/authors/tori-turner.jpeg',
      section: 'Lights Out Writer'
    },
    'Arelimar Colon Rodriguez': {
      pic: 'assets/images/authors/arelimar-rodriguez.jpeg',
      section: 'Lights Out Writer'
    },
    'Eya Amri': {
      pic: 'assets/images/authors/eya-amri.jpg',
      section: 'Lights Out Founder and Editor-in-chief'
    },
    Default: {
      pic: 'assets/images/authors/eya-amri.jpg',
      section: 'Lights Out Writer'
    }
  };

  function getAuthorMeta(name) {
    const trimmed = (name || '').trim();
    const key = Object.keys(AUTHOR_META)
      .filter((authorName) => authorName !== 'Default')
      .find((authorName) => authorName.toLowerCase() === trimmed.toLowerCase());
    return key ? AUTHOR_META[key] : AUTHOR_META.Default;
  }

  function updateAuthorPreview() {
    const name = document.getElementById('authorName').value || 'Author Name';
    const meta = getAuthorMeta(name);

    document.getElementById('authorPreviewPic').src = meta.pic;
    document.getElementById('authorPreviewName').textContent = name || 'Author Name';
    document.getElementById('authorPreviewSection').textContent = meta.section;
  }

  document.getElementById('authorName').addEventListener('input', updateAuthorPreview);

  const categoryInput = document.getElementById('category');
  const categoryChips = document.getElementById('categoryChips');
  const categoryValues = document.getElementById('categoryValues');
  const selectedCategories = [];

  function renderCategoryChips() {
    categoryChips.innerHTML = '';
    selectedCategories.forEach((category) => {
      const chip = document.createElement('span');
      chip.className = 'category-chip';
      chip.textContent = category;

      const removeButton = document.createElement('button');
      removeButton.type = 'button';
      removeButton.setAttribute('aria-label', `Remove ${category}`);
      removeButton.textContent = 'x';
      removeButton.addEventListener('click', () => {
        const index = selectedCategories.indexOf(category);
        if (index !== -1) selectedCategories.splice(index, 1);
        renderCategoryChips();
      });

      chip.appendChild(removeButton);
      categoryChips.appendChild(chip);
    });
    categoryValues.value = selectedCategories.join(' ');
  }

  categoryInput.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ',') return;
    event.preventDefault();

    const values = categoryInput.value.split(',')
      .map((value) => value.trim())
      .filter(Boolean);

    values.forEach((value) => {
      if (!selectedCategories.includes(value)) selectedCategories.push(value);
    });
    categoryInput.value = '';
    renderCategoryChips();
  });

  categoryInput.addEventListener('blur', () => {
    if (categoryInput.value.trim()) {
      categoryInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
    }
  });

  const articleEditor = document.getElementById('content');

  document.querySelectorAll('[data-command]').forEach((button) => {
    button.addEventListener('click', () => {
      articleEditor.focus();
      document.execCommand(button.dataset.command, false);
    });
  });

  document.getElementById('headingTool').addEventListener('change', (event) => {
    articleEditor.focus();
    document.execCommand('formatBlock', false, event.target.value);
  });

  document.getElementById('inlineImageBtn').addEventListener('click', () => {
    document.getElementById('inlineImageInput').click();
  });

  document.getElementById('inlineImageInput').addEventListener('change', (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      articleEditor.focus();
      document.execCommand('insertImage', false, reader.result);
      event.target.value = '';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('coverImage').addEventListener('change', function () {
    const file = this.files && this.files[0];
    const preview = document.getElementById('imagePreview');
    const wrap = document.getElementById('imagePreviewWrap');

    if (!file) {
      wrap.style.display = 'none';
      preview.src = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = function (event) {
      preview.src = event.target.result;
      wrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  function slugify(value) {
    return (value || '')
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'untitled-article';
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Unable to read the article image.'));
      reader.readAsDataURL(file);
    });
  }

  window.LIGHTSOUT_ENV = window.LIGHTSOUT_ENV || {
    SUPABASE_URL: '',
    SUPABASE_ANON_KEY: ''
  };

  async function ensureRuntimeConfig() {
    const current = window.LIGHTSOUT_ENV || {};
    if (current.SUPABASE_URL && current.SUPABASE_ANON_KEY) {
      return current;
    }

    try {
      const response = await fetch('js/runtime-config.js?ts=' + Date.now(), { cache: 'no-store' });
      const text = await response.text();
      const supabaseUrlMatch = text.match(/SUPABASE_URL:\s*['\"]([^'\"]+)['\"]/);
      const supabaseKeyMatch = text.match(/SUPABASE_ANON_KEY:\s*['\"]([^'\"]+)['\"]/);

      const resolved = {
        ...current,
        SUPABASE_URL: supabaseUrlMatch ? supabaseUrlMatch[1] : '',
        SUPABASE_ANON_KEY: supabaseKeyMatch ? supabaseKeyMatch[1] : ''
      };

      window.LIGHTSOUT_ENV = resolved;
      return resolved;
    } catch (error) {
      console.warn('Could not refresh Supabase runtime config.', error);
      return current;
    }
  }

  function getPasswordValidationUrl() {
    const protocol = window.location.protocol;
    if (protocol === 'file:') {
      return 'http://localhost:8000/api/validate-password';
    }
    return new URL('/api/validate-password', window.location.origin).toString();
  }

  document.getElementById('articleForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const statusEl = document.getElementById('formStatus');
    const submitBtn = document.getElementById('submitBtn');
    const runtimeConfig = await ensureRuntimeConfig();
    const SUPABASE_URL = (runtimeConfig.SUPABASE_URL || '').replace(/\/rest\/v1\/?$/, '');
    const SUPABASE_ANON_KEY = runtimeConfig.SUPABASE_ANON_KEY || '';
    const authorName = document.getElementById('authorName').value.trim();
    const writerPassword = document.getElementById('writerPassword').value.trim();
    const title = document.getElementById('title').value.trim();
    const subtitle = document.getElementById('subtitle').value.trim();
    const category = selectedCategories.join(' ');
    const seoTags = document.getElementById('seoTags').value.trim();
    const content = articleEditor.innerHTML.trim();
    const contentText = articleEditor.textContent.trim();
    const imageFile = document.getElementById('coverImage').files[0];
    const publishedAt = new Date().toISOString();

    const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    if (!supabaseClient) {
      const hasConfig = Boolean(runtimeConfig.SUPABASE_URL && runtimeConfig.SUPABASE_ANON_KEY);
      const configHint = window.location.protocol === 'file:'
        ? 'Serve the site over http://localhost:8000 and regenerate js/runtime-config.js from .env.'
        : hasConfig
          ? 'The Supabase JavaScript library did not load. Check your internet connection or browser network access.'
          : 'Run node scripts/generate-runtime-config.js from the project root to generate js/runtime-config.js from .env.';

      statusEl.style.color = 'red';
      statusEl.textContent = 'Live publishing is unavailable: ' + (hasConfig ? 'Supabase client did not initialize.' : 'Supabase is not configured for this site.') + ' ' + configHint;
      return;
    }

    if (!authorName || !writerPassword || !title || !subtitle || !category || !seoTags || (!contentText && !articleEditor.querySelector('img')) || !imageFile) {
      statusEl.style.color = 'red';
      statusEl.textContent = 'Please complete all required fields before submitting.';
      return;
    }

    let isValidWriterPassword = false;

    try {
      const response = await fetch(getPasswordValidationUrl(), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ type: 'writer', password: writerPassword })
      });

      if (!response.ok) {
        const text = await response.text().catch(() => '');
        throw new Error(text || `Password service returned ${response.status}`);
      }

      const result = await response.json();
      if (!result || typeof result.ok !== 'boolean') {
        throw new Error('Password service returned an invalid response.');
      }

      isValidWriterPassword = result.ok;
    } catch (error) {
      console.error('Writer password validation failed:', error);
      statusEl.style.color = 'red';
      statusEl.textContent = 'Password check failed: ' + (error.message || 'the validation service is unavailable.');
      return;
    }

    if (!isValidWriterPassword) {
      statusEl.style.color = 'red';
      statusEl.textContent = 'Incorrect writer password.';
      return;
    }

    submitBtn.disabled = true;
    statusEl.style.color = 'black';
    statusEl.textContent = 'Publishing article...';

    try {
      const imageDataUrl = await readFileAsDataUrl(imageFile);
      const authorMeta = getAuthorMeta(authorName);
      const articleId = slugify(title);

      const articlePayload = {
        id: articleId,
        title,
        subtitle,
        description: subtitle,
        author_name: authorName,
        author_pic: authorMeta.pic,
        author_section: authorMeta.section,
        category,
        image: imageDataUrl,
        seo_tags: seoTags,
        tags: seoTags,
        published_at: publishedAt,
        content
      };

      let dbError = null;
      try {
        const { error } = await supabaseClient.from('articles').insert([articlePayload]);
        dbError = error || null;
      } catch (error) {
        dbError = error;
      }

      if (dbError) {
        throw new Error(dbError.message || 'Failed to publish the article to Supabase.');
      }

      statusEl.style.color = 'green';
      statusEl.textContent = 'Published! Redirecting to articles feed...';

      setTimeout(() => {
        window.location.href = 'articles.html';
      }, 1500);
    } catch (err) {
      console.error('Submission error:', err);
      statusEl.style.color = 'red';
      statusEl.textContent = 'Error: ' + (err.message || 'Unable to publish this article.');
      submitBtn.disabled = false;
    }
  });

  updateAuthorPreview();
</script>
