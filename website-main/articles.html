    .load-more-btn {

      padding: 12px 28px;

      border: 1px solid rgba(0,0,0,0.15);
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .load-more-btn:hover {
      transform: translateY(-1px);
    }
    .load-more-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
  </style>
</head>

<body>

<nav class="filter-nav">

<main class="news-grid-container" id="newsGrid"></main>

<div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
  <button class="load-more-btn" id="loadMoreBtn" type="button">Load more articles</button>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/runtime-config.js"></script>
  <script>
    const STORAGE_KEY = 'lightsoutSubmittedArticles';
    const PAGE_SIZE = 24;

    let currentOffset = 0;
    let reachedEnd = false;
    let isLoading = false;

    function normalizeRuntimeConfig(config = {}) {
      return {
        SUPABASE_URL: String(config.SUPABASE_URL || '').trim(),
        SUPABASE_ANON_KEY: String(config.SUPABASE_ANON_KEY || '').trim()
      };
    }

    function getLocalArticles() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function mapDbRowToArticle(row) {
      return {
        id: row.id || row.slug || 'untitled-article',
        title: row.title || 'Untitled Article',
        subtitle: row.subtitle || row.description || '',
        authorName: row.author_name || 'Lights Out Team',
        authorPic: row.author_pic || 'assets/images/authors/eya-amri.jpg',
        author_pic: row.author_pic || 'assets/images/authors/eya-amri.jpg',
        category: row.category || 'news',
        image: row.image || 'assets/images/intro.png',
        seoTags: row.seo_tags || row.tags || '',
        tags: row.seo_tags || row.tags || '',
        description: row.subtitle || row.description || '',
        publishedAt: row.published_at || new Date().toISOString(),
        published_at: row.published_at || new Date().toISOString(),
        author_section: row.author_section || 'Lights Out Writer'
      };
    }

    const runtimeConfig = normalizeRuntimeConfig(window.LIGHTSOUT_ENV);
    const SUPABASE_URL = (runtimeConfig.SUPABASE_URL || '').replace(/\/rest\/v1\/?$/, '');
    const SUPABASE_ANON_KEY = runtimeConfig.SUPABASE_ANON_KEY || '';
    const supabaseClient = SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    async function fetchArticlePage(offset, limit) {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('articles')
            .select('id, title, subtitle, description, author_name, author_pic, category, image, published_at')
            .lte('published_at', new Date().toISOString())
            .order('published_at', { ascending: false })
            .range(offset, offset + limit - 1);

          if (!error && data) {
            return data.map(mapDbRowToArticle);
          }

          if (error) {
            console.warn('Supabase article fetch returned an error; using local fallback.', error);
          }
        } catch (error) {
          console.warn('Supabase article fetch failed; using local fallback.', error);
        }
      }

      if (offset > 0) return [];
      const isPublished = (article) =>
        new Date(article.publishedAt || article.published_at || 0).getTime() <= Date.now();
      return getLocalArticles()
        .filter(isPublished)
        .sort((a, b) => new Date(b.publishedAt || b.published_at) - new Date(a.publishedAt || a.published_at));
    }

    function articleCardHTML(article) {
      const category = article.category || 'news';
      const title = article.title || 'Untitled Article';
      const description = article.subtitle || article.description || 'A freshly submitted story from the Lights Out newsroom.';
      const image = article.image || 'assets/images/intro.png';
      const publishedAt = article.publishedAt || article.published_at || new Date().toISOString();
      const articleId = article.id || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');

      return `
        <article class="news-card" data-category="${category}">
          <div class="card-image-box">
            <a href="article.html?id=${encodeURIComponent(articleId)}">
              <img src="${image}" alt="${title.replace(/"/g, '&quot;')}">
            </a>
          </div>
          <div class="card-text-box">
            <h3 class="card-title">${title}</h3>
            <p class="card-description">${description}</p>
            <span class="card-time" data-timestamp="${publishedAt}">Calculating time...</span>
          </div>
        </article>
      `;
    }

    function updateTimeLabels() {
      const now = new Date();
      document.querySelectorAll('.card-time').forEach((label) => {
        const timestampStr = label.getAttribute('data-timestamp');
        if (!timestampStr) return;
        const postDate = new Date(timestampStr);
        const secondsAgo = Math.floor((now - postDate) / 1000);

        if (secondsAgo < 0) {
          label.textContent = 'Just now';
          return;
        }

        const intervals = { year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60 };
        let timeString = 'Just now';

        for (const [unit, value] of Object.entries(intervals)) {
          const count = Math.floor(secondsAgo / value);
          if (count >= 1) {
            timeString = `${count} ${unit}${count > 1 ? 's' : ''} ago`;
            break;
          }
        }

        if (timeString === 'Just now' && secondsAgo >= 1) {
          timeString = `${secondsAgo} second${secondsAgo > 1 ? 's' : ''} ago`;
        }

        label.textContent = timeString;
      });
    }

    async function loadNextPage() {
      if (isLoading || reachedEnd) return;
      isLoading = true;

      const loadMoreBtn = document.getElementById('loadMoreBtn');
      const loadMoreWrap = document.getElementById('loadMoreWrap');
      if (loadMoreBtn) {
        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = 'Loading...';
      }

      const grid = document.getElementById('newsGrid');
      const batch = await fetchArticlePage(currentOffset, PAGE_SIZE);

      if (batch.length > 0) {
        grid.insertAdjacentHTML('beforeend', batch.map(articleCardHTML).join(''));
        currentOffset += batch.length;
        updateTimeLabels();
        applyActiveFilter();
      }

      if (batch.length < PAGE_SIZE) {
        reachedEnd = true;
        if (loadMoreWrap) loadMoreWrap.style.display = 'none';
      } else if (loadMoreWrap) {
        loadMoreWrap.style.display = 'flex';
        if (loadMoreBtn) {
          loadMoreBtn.disabled = false;
          loadMoreBtn.textContent = 'Load more articles';
        }
      }

      isLoading = false;
    }

    function applyActiveFilter() {
      const activeBtn = document.querySelector('.filter-btn.active');
      const filter = activeBtn ? activeBtn.getAttribute('data-filter') : 'all';
      document.querySelectorAll('#newsGrid .news-card').forEach((card) => {
        const cats = (card.getAttribute('data-category') || '').split(' ');
        card.style.display = (filter === 'all' || cats.includes(filter)) ? '' : 'none';
      });
    }

    document.querySelectorAll('.filter-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyActiveFilter();
      });
    });

    document.getElementById('loadMoreBtn').addEventListener('click', loadNextPage);

    setInterval(updateTimeLabels, 60000);

    loadNextPage();
  </script>

</body>
</html>
